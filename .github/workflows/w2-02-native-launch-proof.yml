name: W2-02 native launch proof
# W2-02 — the final QANDEEL app icon and the static launch → system handoff, proved on INSTALLED Release builds.
# VALIDATION ONLY.
#
# Both jobs build the PRODUCT entry exactly as Mobile CI does (no proof root, no configuration, no credential)
# and add NO production delay: the transient system launch surfaces are captured with the platforms' own screen
# recorders and every frame is classified by scripts/w2/analyze-w2-02-launch-recording.mjs.
#
#   Android (API 36 emulator): APK icon rasters pixel-identical to I-08B2.5, the launcher label and icon, and
#     three cold launches — system Light first launch, system Light after the application night mode is set,
#     system Dark — each with the canonical icon on the World, no second splash and no white / black flash.
#   iOS (iPhone 17 / iOS 26.5 simulator): the compiled Info.plist / launch storyboard / asset catalogue, the
#     SpringBoard icon, and cold launches with the device in Light and in Dark — the World only, then the Dark
#     World as the first app-owned frame.
#
# Every screenshot, recording, keyframe, contact sheet, per-frame analysis and log is uploaded, pass or fail.
# A red run stays red: nothing here retries.
#
# Scoped to the W2-02 branch: it proves that branch's heads and is inert everywhere else.
on:
  push:
    branches: ['feat/w2-02-production-launch-identity']
    paths:
      - 'apps/mobile/**'
      - 'scripts/w2/**'
      - 'package-lock.json'
      - '.github/workflows/w2-02-native-launch-proof.yml'
concurrency:
  group: w2-02-native-launch-proof-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: 1
  EXPO_NO_TELEMETRY: 1
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_VERSION: 2.10.0
  MAESTRO_ZIP_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
jobs:
  proof-android:
    name: W2-02 proof — Android API 36 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - {name: Install dependencies from the root lockfile, run: npm ci}
      - {name: Generate the Android project (CNG), run: npm run prebuild:android --workspace @qandeel/mobile}
      - name: Build the Product Release APK (x86_64 for the emulator)
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install ffmpeg (frame extraction and pixel comparison)
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prove the launch identity on the Android emulator (API 36, x86_64, google_apis)
        timeout-minutes: 40
        env:
          APK: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-boot-timeout: 900
          script: bash scripts/w2/run-w2-02-android-proof.sh "$APK" "$RUNNER_TEMP/w2-02-android"
      - name: Summarize
        if: always()
        run: |
          { echo '### W2-02 Android native launch proof'; echo '```'; cat "$RUNNER_TEMP/w2-02-android/summary.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-02-android-launch-proof-${{ github.sha }}
          path: ${{ runner.temp }}/w2-02-android
          if-no-files-found: warn

  proof-ios:
    name: W2-02 proof — iOS 26.5 simulator
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_SIMULATOR_NAME: iPhone 17
      IOS_SIMULATOR_RUNTIME_SUFFIX: iOS-26-5
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Select Xcode 26.6 explicitly (never the runner default)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version | grep -x 'Xcode 26.6'
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Setup Temurin JDK 17 (Maestro tooling path)
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - {name: Install dependencies from the root lockfile, run: npm ci}
      - {name: Generate the iOS project (CNG), run: npm run prebuild:ios --workspace @qandeel/mobile}
      - name: Install CocoaPods dependencies
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build the Product Release simulator app
        run: |
          set -o pipefail
          workspace="$(ls -d apps/mobile/ios/*.xcworkspace | head -n 1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild -quiet -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath apps/mobile/ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          app="$(find apps/mobile/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$app"
          echo "IOS_APP_PATH=$app" >> "$GITHUB_ENV"
      - name: Boot the authorized simulator (iPhone 17 on iOS 26.5)
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r --arg name "$IOS_SIMULATOR_NAME" --arg suffix "$IOS_SIMULATOR_RUNTIME_SUFFIX" '.devices | to_entries[] | select(.key | endswith($suffix)) | .value[] | select(.name == $name) | .udid' | head -n 1)"
          if [ -z "$udid" ]; then echo "STOP: ${IOS_SIMULATOR_NAME} / ${IOS_SIMULATOR_RUNTIME_SUFFIX} is not on this image"; xcrun simctl list devices available; exit 1; fi
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "IOS_SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified before extraction)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | shasum -a 256 --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Install ffmpeg (frame extraction and pixel comparison)
        run: command -v ffmpeg || brew install ffmpeg
      - name: Prove the launch identity on the iOS simulator
        timeout-minutes: 30
        run: bash scripts/w2/run-w2-02-ios-proof.sh "$IOS_APP_PATH" "$RUNNER_TEMP/w2-02-ios" "$IOS_SIM_UDID"
      - name: Summarize
        if: always()
        run: |
          { echo '### W2-02 iOS native launch proof'; echo '```'; cat "$RUNNER_TEMP/w2-02-ios/summary.txt" 2>/dev/null; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w2-02-ios-launch-proof-${{ github.sha }}
          path: ${{ runner.temp }}/w2-02-ios
          if-no-files-found: warn
          include-hidden-files: true
