name: W1B-01 visual proof
# W1B-01 — the production Auth Gateway onward on an Android emulator. VALIDATION ONLY.
#
# "Auth Gateway onward": Sign in → Create account → Verify Email → the concise first-use Welcome → the
# First Conversation Opening → the composer. It is NOT the cold-start journey: the static launch and the
# Lantern Gateway Identity Moment (QAN-BL-LANTERN-01) precede the Auth Gateway and are not part of W1B-01.
#
# Builds a Release APK whose ROOT COMPONENT is the W1B-01 proof root (one recorded change of the mobile
# manifest's `main`, made by `apps/mobile/scripts/select-w1b-proof-entry.mjs` in this ephemeral checkout
# only). The proof root mounts the PRODUCTION `RuntimePhaseSurface` over the production
# `createIntegrationRuntime`, given an in-memory identity provider and a scripted network instead of
# Supabase and the API: no credential exists in this job, no Email is sent, and the flows type a RANDOM
# password and a RANDOM code. Live Email-code delivery is not, and cannot be, proved here.
#
# scripts/w1b/run-w1b-proof.sh drives four runs — English journey, Arabic journey, Arabic journey at the
# largest text size, and Create account at the largest text size with the keyboard measured and the
# accessibility tree censused — and uploads every screenshot, hierarchy dump, measurement and log.
#
# Scoped to the W1B-01 branch: it proves that branch's heads and is inert everywhere else.
on:
  push:
    branches: ['feat/w1b-01-account-identity-first-use']
    paths:
      - 'apps/mobile/**'
      - 'scripts/w1b/**'
      - 'package-lock.json'
      - '.github/workflows/w1b-01-visual-proof.yml'
concurrency:
  group: w1b-01-visual-proof-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: 1
  MAESTRO_VERSION: 2.10.0
  MAESTRO_ZIP_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
jobs:
  proof-android:
    name: W1B-01 proof — Android API 36 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - {name: Install dependencies from the root lockfile, run: npm ci}
      - name: Select the W1B-01 proof entry (the one recorded difference from the Product build)
        env: {W1B01_VISUAL_PROOF: '1'}
        run: |
          node apps/mobile/scripts/select-w1b-proof-entry.mjs --apply
          echo "### W1B-01 proof build — main: \`$(node -p "require('./apps/mobile/package.json').main")\`, commit \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
      - {name: Generate the Android project (CNG), run: npm run prebuild:android --workspace @qandeel/mobile}
      - name: Build the Release APK (x86_64 for the emulator)
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified before extraction)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drive the proof on the Android emulator (API 36, x86_64, google_apis)
        env:
          APK: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-boot-timeout: 900
          script: bash scripts/w1b/run-w1b-proof.sh "$APK" "$RUNNER_TEMP/w1b-proof"
      - name: Upload the proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w1b-01-visual-proof-${{ github.sha }}
          path: ${{ runner.temp }}/w1b-proof
          if-no-files-found: warn
          # Maestro's debug output lives under a hidden .maestro folder.
          include-hidden-files: true
