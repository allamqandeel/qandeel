name: Mobile CI
# MOB-CI-01. Root toolchain/script changes must still receive mobile contract
# validation, so `package.json` deliberately stays in the trigger. What must not
# follow from a backend-only or root-script-only change is a full Android
# Release build + emulator smoke and a ~17-minute Xcode Release simulator build.
#
# Mobile CI is therefore split into a FAST MOBILE CONTRACT GATE that always runs
# and CONDITIONAL NATIVE SMOKE GATES that run only for true native-impact
# changes. The optimization is WHEN native smoke runs, never what it proves when
# it runs: the Android and iOS jobs below keep their full Release build,
# install and boot-smoke contract.
on:
  pull_request:
    paths: ['apps/mobile/**', 'packages/runtime/**', 'tests/mobile-foundation-toolchain-contract.test.mjs', 'tests/mobile-canonical-state-contract.test.mjs', 'tests/living-analysis-map-runtime-contract.test.mjs', 'tests/temporal-navigation-layer-contract.test.mjs', 'tests/return-navigation-layer-contract.test.mjs', 'tests/inspection-orientation-return-chrome-contract.test.mjs', 'tests/t10-motion-contract.test.mjs', 'tests/t11-responsive-contract.test.mjs', 'tests/t12-integration-contract.test.mjs', 'tests/t12p-mobile-runtime-entry-contract.test.mjs', 'tests/t13-recovery-persistence-contract.test.mjs', 'tests/t14-mobile-product-sign-in-gateway-contract.test.mjs', 'tests/session-semantic-clock-sp-lh-delivery-contract.test.mjs', 'tests/mobile-native-impact-classifier.test.mjs', 'tests/qan-inf-03-deterministic-expo-dependency-validation-contract.test.mjs', 'tests/qan-inf-04-native-ci-artifact-reuse-contract.test.mjs', 'scripts/classify-mobile-native-impact.mjs', 'scripts/phase-m/native-build-fingerprint.mjs', 'scripts/phase-m/native-artifact-manifest.mjs', 'scripts/phase-m/verify-native-artifact-manifest.mjs', 'package.json', 'package-lock.json', 'scripts/preflight.mjs', '.github/workflows/mobile-ci.yml', '.github/workflows/t12-phase-m-cloud-validation.yml', '.github/workflows/mobile-expo-dependency-drift-advisory.yml']
  push:
    branches: [main]
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 1
  EXPO_NO_TELEMETRY: 1
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_VERSION: 2.10.0
  MAESTRO_ZIP_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
jobs:
  verify-mobile-contracts:
    name: Fast mobile contract gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      native_impact: ${{ steps.classify.outputs.native_impact }}
    steps:
      # Full history so the changed-file set can be derived deterministically
      # from the real merge base; a shallow clone would force the fail-safe.
      - {name: Checkout, uses: actions/checkout@v4, with: {fetch-depth: 0}}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      # No JDK is set up here on purpose: every gate in this job is Node-only.
      # Gradle and the Maestro tooling path live in the native jobs below.
      - name: Classify native impact
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            base="${PR_BASE_SHA:-}"; head="${PR_HEAD_SHA:-}"
          else
            base="${PUSH_BEFORE_SHA:-}"; head="${PUSH_HEAD_SHA:-}"
          fi
          echo "event=$EVENT_NAME base=${base:-<none>} head=${head:-<none>}"
          files=""
          # Fail safe: an unestablished comparison base means native smoke runs.
          if [ -n "$base" ] && [ -n "$head" ] &&
             [ "$base" != "0000000000000000000000000000000000000000" ] &&
             git cat-file -e "${base}^{commit}" 2>/dev/null &&
             git cat-file -e "${head}^{commit}" 2>/dev/null; then
            merge_base="$(git merge-base "$base" "$head" 2>/dev/null || true)"
            [ -n "$merge_base" ] && base="$merge_base"
            files="$(git diff --name-only "$base" "$head" 2>/dev/null || true)"
          else
            echo "the comparison base could not be established; failing safe to native_impact=true"
          fi
          native_impact="$(printf '%s\n' "$files" | node scripts/classify-mobile-native-impact.mjs)"
          echo "native_impact=$native_impact" >> "$GITHUB_OUTPUT"
          echo "### Mobile CI native impact: \`$native_impact\`" >> "$GITHUB_STEP_SUMMARY"
      - {name: Install dependencies from the root lockfile, run: npm ci}
      - {name: Verify repository preflight (Node >=22.13.0), run: npm run preflight}
      - {name: Verify npm-only toolchain contract, run: npm run test:toolchain}
      - {name: Verify mobile foundation toolchain contract, run: npm run test:mobile-foundation-contract}
      - {name: Verify mobile canonical state contract (T-02), run: npm run test:mobile-canonical-state-contract}
      - {name: Verify Living Analysis Map runtime contract (T-04), run: npm run test:living-analysis-map-runtime-contract}
      - {name: Verify Temporal Navigation Layer contract (T-06), run: npm run test:temporal-navigation-layer-contract}
      - {name: Verify Return Navigation Layer contract (T-07), run: npm run test:return-navigation-layer-contract}
      - {name: Verify Inspection + Orientation + Return Chrome contract (T-08), run: npm run test:inspection-orientation-return-chrome-contract}
      - {name: Verify Living Analysis Map Motion System contract (T-10), run: npm run test:t10-motion-contract}
      - {name: Verify Responsive Recomposition contract (T-11), run: npm run test:t11-responsive-contract}
      - {name: Verify Mobile Runtime Entry Preconditions contract (T-12P), run: npm run test:t12p-mobile-runtime-entry-contract}
      - {name: Verify Final Living Analysis Map Integration contract (T-12), run: npm run test:t12-integration-contract}
      - {name: Verify Recovery / Persistence contract (T-13), run: npm run test:t13-recovery-persistence-contract}
      - {name: Verify Mobile Product Sign-In Gateway contract (T-14), run: npm run test:t14-mobile-product-sign-in-gateway-contract}
      - {name: Verify Session Semantic Clock / SP / LH delivery contract (T-03A2), run: npm run test:session-semantic-clock-sp-lh-delivery-contract}
      - {name: Verify the native-impact classifier, run: npm run test:mobile-native-impact-classifier}
      - {name: Verify deterministic Expo SDK 57 dependency validation contract (QAN-INF-03), run: npm run test:qan-inf-03-deterministic-expo-dependency-validation-contract}
      - {name: Verify native CI build/validation decoupling contract (QAN-INF-04), run: npm run test:qan-inf-04-native-ci-artifact-reuse-contract}
      - {name: Type-check mobile (TypeScript 5.9 line), run: npm run typecheck:mobile}
      - {name: Lint mobile, run: npm run lint:mobile}
      - {name: Unit and component tests (jest-expo), run: npm run test:mobile}
      # QAN-INF-03: `EXPO_OFFLINE` makes `expo install --check` validate against the
      # deterministic `expo/bundledNativeModules.json` shipped inside the installed,
      # lockfile-pinned `expo` package instead of the mutable live registry, so a
      # previously green, unchanged commit cannot go red merely because Expo
      # publishes a newer recommended patch. `expo-doctor`'s dependency-version
      # check spawns this exact command as a subprocess and inherits this env, so it
      # is covered too; `EXPO_DOCTOR_ENABLE_DIRECTORY_CHECK: '0'` turns off its
      # separate, independently-live React Native Directory check for the same
      # reason. Real dependency compatibility is still enforced: see
      # `.github/workflows/mobile-expo-dependency-drift-advisory.yml` for the live
      # signal this intentionally no longer gates merges.
      - {name: Expo dependency validation (intentional typescript exclusion), run: npm run deps:check:mobile, env: {EXPO_OFFLINE: '1'}}
      - {name: Expo Doctor, run: npm run doctor:mobile, env: {EXPO_OFFLINE: '1', EXPO_DOCTOR_ENABLE_DIRECTORY_CHECK: '0'}}
      - {name: Prebuild idempotency gate (CNG Level 2), run: npm run prebuild:mobile}
  verify-android:
    name: Android (API 36 emulator boot smoke)
    needs: verify-mobile-contracts
    if: needs.verify-mobile-contracts.outputs.native_impact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      # QAN-INF-04 — the binary is keyed by its build inputs, not by this run.
      #
      # The fingerprint covers every tracked path that can reach the APK and excludes only the Maestro
      # flows, the runner-only `scripts/phase-m/` orchestration and prose. So a head that changed a flow,
      # a doc or a Phase-M script restores the APK an equivalent head already produced, and a head that
      # touched `apps/mobile/src`, the lockfile or the app config does not and cannot: any rule change
      # that alters the included set alters the digest, so the key is self-protecting against its own
      # drift. Re-running THIS job after a flaky emulator restores the same key and skips Gradle
      # entirely, which is the failure this task exists to stop paying for.
      #
      # The restore is a hint, never a licence: the provenance gate below re-derives everything and
      # refuses the artifact outright if it cannot prove it. A cache miss simply builds.
      - name: Compute the build-input fingerprint
        id: fingerprint
        run: |
          value="$(node scripts/phase-m/native-build-fingerprint.mjs)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "### Android build-input fingerprint: \`$value\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore a build-compatible Release APK, if one exists
        id: native-build-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/native-build
          key: qandeel-native-android-x86_64-PRODUCT-mobile-ci-boot-smoke-v1-${{ steps.fingerprint.outputs.value }}
      # Everything from here to the provenance gate is the BUILD, and it is skipped wholesale on a hit.
      # `npm ci` is part of it: nothing after the gate needs `node_modules`, because the gate, the
      # evidence and the smoke use Node builtins, Maestro and the platform tools alone.
      - {name: Install dependencies from the root lockfile, if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm ci}
      # The fast gate already proved contracts, typecheck, lint, Jest, Expo
      # dependency validation, Expo Doctor and prebuild idempotency. This job
      # exists to prove native generation, build, install and boot.
      - {name: Generate the Android project (CNG), if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm run prebuild:android --workspace @qandeel/mobile}
      - name: Build the Release APK (x86_64 for the emulator)
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Stage the artifact and record its identity
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          out="$RUNNER_TEMP/native-build"
          mkdir -p "$out"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$out/app-release.apk"
          node scripts/phase-m/native-artifact-manifest.mjs \
            --platform android --role PRODUCT --recipe mobile-ci-boot-smoke --abis x86_64 \
            --artifact "$out/app-release.apk" --out "$out/native-artifact-manifest.json"
      # THE GATE. It runs on both paths. On a miss it confirms what this job just built; on a hit it is
      # the whole argument for installing a binary this job did not produce. `prior-run` is the honest
      # mode for a restored artifact: an equal fingerprint from another head is exactly the claim, and
      # the commit is expected to differ.
      - name: Verify the artifact provenance BEFORE anything is installed
        env:
          MODE: ${{ steps.native-build-cache.outputs.cache-hit == 'true' && 'prior-run' || 'same-run' }}
        run: |
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/app-release.apk" \
            --mode "$MODE" --platform android --role PRODUCT \
            --recipe mobile-ci-boot-smoke --abis x86_64 --commit "${{ github.sha }}"
          echo "### Android artifact provenance: \`$MODE\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified before extraction)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Guard the Maestro version
        run: |
          maestro --version
          maestro --version 2>/dev/null | grep -qx "${MAESTRO_VERSION}"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot smoke on the Android emulator (API 36, x86_64, google_apis)
        env:
          APK: ${{ runner.temp }}/native-build/app-release.apk
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r "$APK"
            maestro test apps/mobile/.maestro/boot-smoke.yaml
      - name: Upload the Release APK and its identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qandeel-mobile-android-release-apk
          path: ${{ runner.temp }}/native-build
          if-no-files-found: ignore
  verify-ios:
    name: iOS (iPhone 17 / iOS 26.5 simulator boot smoke)
    needs: verify-mobile-contracts
    if: needs.verify-mobile-contracts.outputs.native_impact == 'true'
    runs-on: macos-26
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_SIMULATOR_NAME: iPhone 17
      IOS_SIMULATOR_RUNTIME_SUFFIX: iOS-26-5
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Select Xcode 26.6 explicitly (never the runner default)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -version | grep -x 'Xcode 26.6'
      - name: Guard the simulator (iPhone 17 on iOS 26.5)
        run: |
          xcrun simctl list runtimes
          udid="$(xcrun simctl list devices available -j | jq -r --arg name "$IOS_SIMULATOR_NAME" --arg suffix "$IOS_SIMULATOR_RUNTIME_SUFFIX" '.devices | to_entries[] | select(.key | endswith($suffix)) | .value[] | select(.name == $name) | .udid' | head -n 1)"
          if [ -z "$udid" ]; then
            echo "STOP: the authorized simulator (${IOS_SIMULATOR_NAME} / ${IOS_SIMULATOR_RUNTIME_SUFFIX}) is not on this image"
            xcrun simctl list devices available
            exit 1
          fi
          echo "IOS_SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "simulator udid: $udid"
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Setup Temurin JDK 17 (Maestro tooling path)
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      # QAN-INF-04 — the same build-input key as the Android job, for the same reason, at seventeen
      # minutes a rebuild instead of ten. See that job for why the key is self-protecting.
      - name: Compute the build-input fingerprint
        id: fingerprint
        run: |
          value="$(node scripts/phase-m/native-build-fingerprint.mjs)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "### iOS build-input fingerprint: \`$value\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore a build-compatible Release simulator app, if one exists
        id: native-build-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/native-build
          key: qandeel-native-ios-simulator-PRODUCT-mobile-ci-boot-smoke-v1-${{ steps.fingerprint.outputs.value }}
      - {name: Install dependencies from the root lockfile, if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm ci}
      - {name: Generate the iOS project (CNG), if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm run prebuild:ios --workspace @qandeel/mobile}
      - name: Install CocoaPods dependencies
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build the Release simulator app
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          workspace="$(ls -d apps/mobile/ios/*.xcworkspace | head -n 1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild -quiet -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath apps/mobile/ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      # Packaged before it is installed, not after: the archive is what the key caches and what a later
      # run installs, so the bytes that are validated here are the bytes a reuse would validate there.
      - name: Package the simulator app and record its identity
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          out="$RUNNER_TEMP/native-build"
          mkdir -p "$out"
          app="$(find apps/mobile/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$app"
          ditto -c -k --keepParent "$app" "$out/qandeel-ios-simulator.app.zip"
          node scripts/phase-m/native-artifact-manifest.mjs \
            --platform ios --role PRODUCT --recipe mobile-ci-boot-smoke \
            --artifact "$out/qandeel-ios-simulator.app.zip" --out "$out/native-artifact-manifest.json"
      - name: Verify the artifact provenance BEFORE anything is installed
        env:
          MODE: ${{ steps.native-build-cache.outputs.cache-hit == 'true' && 'prior-run' || 'same-run' }}
        run: |
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/qandeel-ios-simulator.app.zip" \
            --mode "$MODE" --platform ios --role PRODUCT \
            --recipe mobile-ci-boot-smoke --commit "${{ github.sha }}"
          echo "### iOS artifact provenance: \`$MODE\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Boot the simulator and install the verified app
        run: |
          xcrun simctl boot "$IOS_SIM_UDID" || true
          xcrun simctl bootstatus "$IOS_SIM_UDID" -b
          ditto -x -k "$RUNNER_TEMP/native-build/qandeel-ios-simulator.app.zip" "$RUNNER_TEMP/native-app"
          app="$(find "$RUNNER_TEMP/native-app" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$app"
          xcrun simctl install "$IOS_SIM_UDID" "$app"
          echo "IOS_APP_PATH=$app" >> "$GITHUB_ENV"
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified before extraction)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | shasum -a 256 --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Guard the Maestro version
        run: |
          maestro --version
          maestro --version 2>/dev/null | grep -qx "${MAESTRO_VERSION}"
      - name: Boot smoke on the iOS simulator
        run: maestro --device "$IOS_SIM_UDID" test apps/mobile/.maestro/boot-smoke.yaml
      - name: Upload the simulator app and its identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qandeel-mobile-ios-simulator-app
          path: ${{ runner.temp }}/native-build
          if-no-files-found: ignore
