name: Mobile CI
# MOB-CI-01. Root toolchain/script changes must still receive mobile contract
# validation, so `package.json` deliberately stays in the trigger. What must not
# follow from a backend-only or root-script-only change is a full Android
# Release build + emulator smoke and a ~17-minute Xcode Release simulator build.
#
# Mobile CI is therefore split into a FAST MOBILE CONTRACT GATE that always runs
# and CONDITIONAL NATIVE SMOKE GATES that run only for true native-impact
# changes. The optimization is WHEN native smoke runs, never what it proves when
# it runs: the Android and iOS chains below keep their full Release build,
# install and boot-smoke contract.
#
# QAN-INF-04-FIX-01 — why each platform is TWO jobs rather than one.
#
# QAN-INF-04 keyed the native binary by its build inputs so a flaky emulator would not cost a rebuild,
# and relied on `actions/cache` alone to carry it. That does not hold for the failure it was built for.
# A cache is saved in a POST step, and the post step is SKIPPED when the job fails — so the one run that
# needed the reuse is the one run that never wrote the key. Measured on T-14's first Mobile CI failure
# (run 34699120176, build-input fingerprint b8317330): the Android job built the APK, passed provenance,
# uploaded the binary, then failed at the emulator; the repository's cache list holds the iOS entry for
# that fingerprint and no Android entry at all. The binary existed, was verified, and was uploaded, and
# a rerun would still have run Gradle from scratch, because the job had no artifact-download path.
#
# So the reuse guarantee is moved off the cache and onto the UPLOADED ARTIFACT, by splitting the build
# from the validation:
#
#   build-android  -> verify-android      build-ios -> verify-ios
#
# The producer builds once and uploads the verified binary with its identity manifest. The consumer
# downloads that artifact, re-proves its provenance, and only then installs and boots it. It contains no
# Gradle, no `xcodebuild`, no `pod install`, no prebuild and no `npm ci` — so a flaked validation is
# retried with GitHub's own "re-run failed jobs", which re-runs the consumer alone, leaves the succeeded
# producer untouched, and cannot rebuild anything. There is no automatic retry: a native failure stays a
# human decision to look at it first.
#
# `actions/cache` is KEPT in the producers, demoted to what it always honestly was — an optimization for
# a fresh head whose inputs already have a binary. It is no longer the retry mechanism, so its post-step
# skip on failure costs nothing.
#
# VAL-01 — change-aware, in three layers (scripts/validation/change-planner.mjs):
#
#   MOBILE_CONTRACT       the fast contract gate. CARRY_FORWARD only when the latest update cannot reach it and
#                         the predecessor head's evidence is PROVEN green; the root contracts that read a changed
#                         doc / flow / runner still run at this head (`mobile-bound-contracts`).
#   MOBILE_NATIVE_BINARY  the build producers + device consumers. NOT_RELEVANT when the PR's cumulative diff
#                         holds no native input (MOB-CI-01, unchanged); CARRY_FORWARD when the latest update
#                         holds none and the predecessor's native evidence is proven green; RUN otherwise.
#   DEVICE_PROOF_FLOW     a Maestro flow is native-relevant here only if this gate's consumers run it.
#
# A gate is skipped ONLY on the literal plan outputs CARRY_FORWARD / NOT_RELEVANT; a failed or silent planner
# makes it run. `main` is never carried forward. Device consumers carry the retry budget (one classified
# rerun) and a bounded driver-readiness probe, so a dead simulator fails in minutes, classified.
on:
  pull_request:
    paths: ['scripts/validation/**', 'tests/val-01-change-aware-validation-contract.test.mjs', 'apps/mobile/**', 'packages/runtime/**', 'tests/mobile-foundation-toolchain-contract.test.mjs', 'tests/mobile-canonical-state-contract.test.mjs', 'tests/living-analysis-map-runtime-contract.test.mjs', 'tests/temporal-navigation-layer-contract.test.mjs', 'tests/return-navigation-layer-contract.test.mjs', 'tests/inspection-orientation-return-chrome-contract.test.mjs', 'tests/t10-motion-contract.test.mjs', 'tests/t11-responsive-contract.test.mjs', 'tests/t12-integration-contract.test.mjs', 'tests/t12p-mobile-runtime-entry-contract.test.mjs', 'tests/t13-recovery-persistence-contract.test.mjs', 'tests/t14-mobile-product-sign-in-gateway-contract.test.mjs', 'tests/w1a-01-conversation-core-contract.test.mjs', 'tests/w1b-01-account-identity-first-use-contract.test.mjs', 'tests/w2-01-final-account-access-contract.test.mjs', 'tests/w2-02-production-launch-identity-contract.test.mjs', 'tests/w3-01-general-settings-appearance-signout-contract.test.mjs', 'tests/w3-02-account-identity-public-id-contract.test.mjs', 'tests/w3-mega-a-account-identity-security-contract.test.mjs', 'tests/w3-mega-s-personal-controls-settings-contract.test.mjs', 'tests/w3-mega-u2-understanding-surface-contract.test.mjs', 'tests/w3-mega-u3-contested-runtime-contract.test.mjs', 'tests/session-semantic-clock-sp-lh-delivery-contract.test.mjs', 'tests/mobile-native-impact-classifier.test.mjs', 'tests/qan-inf-03-deterministic-expo-dependency-validation-contract.test.mjs', 'tests/qan-inf-04-native-ci-artifact-reuse-contract.test.mjs', 'tests/a3-02-native-push-platform-delivery-contract.test.mjs', 'tests/s4-01-shared-world-reachability-contract.test.mjs', 'tests/s4-02-shared-conversation-material-contract.test.mjs', 'tests/s4-03-shared-lifecycle-governance-contract.test.mjs', 'tests/s4-04-shared-activity-notifications-direct-entry-contract.test.mjs', 'tests/s5-01-public-reachability-entry-identity-contract.test.mjs', 'tests/s5-02-public-authoring-rights-privacy-contract.test.mjs', 'tests/a3-proof-leg-isolation-contract.test.mjs', '.github/workflows/a3-proof.yml', 'scripts/a3/**', 'scripts/classify-mobile-native-impact.mjs', 'scripts/phase-m/native-build-fingerprint.mjs', 'scripts/phase-m/native-artifact-manifest.mjs', 'scripts/phase-m/verify-native-artifact-manifest.mjs', 'package.json', 'package-lock.json', 'scripts/preflight.mjs', '.github/workflows/mobile-ci.yml', '.github/workflows/api-ci.yml', '.github/workflows/t12-phase-m-cloud-validation.yml', '.github/workflows/mobile-expo-dependency-drift-advisory.yml']
  push:
    branches: [main]
concurrency:
  group: mobile-ci-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 1
  EXPO_NO_TELEMETRY: 1
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_VERSION: 2.10.0
  MAESTRO_ZIP_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
permissions:
  contents: read
  actions: read
jobs:
  # VAL-01 — the ONE place this workflow decides what runs. The native-impact classification that used to be
  # the first step of the contract gate lives here now (`classifyChangedFiles` over the cumulative diff, with
  # the same fail-safe), beside the latest-update carry-forward law.
  plan:
    name: Change-aware plan (VAL-01)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mobile_contract: ${{ steps.plan.outputs.mobile_contract }}
      mobile_contract_contracts: ${{ steps.plan.outputs.mobile_contract_contracts }}
      mobile_contract_source_run_id: ${{ steps.plan.outputs.mobile_contract_source_run_id }}
      mobile_contract_source_head_sha: ${{ steps.plan.outputs.mobile_contract_source_head_sha }}
      mobile_native_binary: ${{ steps.plan.outputs.mobile_native_binary }}
      mobile_native_binary_source_run_id: ${{ steps.plan.outputs.mobile_native_binary_source_run_id }}
      mobile_native_binary_source_head_sha: ${{ steps.plan.outputs.mobile_native_binary_source_head_sha }}
    steps:
      # Full history so the changed-file sets can be derived deterministically from the real merge base and
      # the real predecessor head; a shallow clone would force the fail-safe.
      - {name: Checkout, uses: actions/checkout@v4, with: {fetch-depth: 0}}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Plan the mobile gates against the cumulative diff and the latest update
        id: plan
        env: {GH_TOKEN: '${{ github.token }}'}
        run: node scripts/validation/plan-validation.mjs plan --workflow mobile-ci

  verify-mobile-contracts:
    name: Fast mobile contract gate
    needs: [plan]
    if: ${{ !cancelled() && needs.plan.outputs.mobile_contract != 'CARRY_FORWARD' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      # No JDK is set up here on purpose: every gate in this job is Node-only.
      # Gradle and the Maestro tooling path live in the native jobs below.
      - {name: Install dependencies from the root lockfile, run: npm ci}
      - {name: Verify repository preflight (Node >=22.13.0), run: npm run preflight}
      - {name: Verify npm-only toolchain contract, run: npm run test:toolchain}
      - {name: Verify mobile foundation toolchain contract, run: npm run test:mobile-foundation-contract}
      - {name: Verify mobile canonical state contract (T-02), run: npm run test:mobile-canonical-state-contract}
      - {name: Verify Living Analysis Map runtime contract (T-04), run: npm run test:living-analysis-map-runtime-contract}
      - {name: Verify Temporal Navigation Layer contract (T-06), run: npm run test:temporal-navigation-layer-contract}
      - {name: Verify Return Navigation Layer contract (T-07), run: npm run test:return-navigation-layer-contract}
      - {name: Verify Inspection + Orientation + Return Chrome contract (T-08), run: npm run test:inspection-orientation-return-chrome-contract}
      - {name: Verify Living Analysis Map Motion System contract (T-10), run: npm run test:t10-motion-contract}
      - {name: Verify Responsive Recomposition contract (T-11), run: npm run test:t11-responsive-contract}
      - {name: Verify Mobile Runtime Entry Preconditions contract (T-12P), run: npm run test:t12p-mobile-runtime-entry-contract}
      - {name: Verify Final Living Analysis Map Integration contract (T-12), run: npm run test:t12-integration-contract}
      - {name: Verify Recovery / Persistence contract (T-13), run: npm run test:t13-recovery-persistence-contract}
      - {name: Verify Mobile Product Sign-In Gateway contract (T-14), run: npm run test:t14-mobile-product-sign-in-gateway-contract}
      - {name: Verify Authenticated Personal Conversation Core contract (W1A-01), run: npm run test:w1a-01-conversation-core-contract}
      - {name: Verify Account Identity + Verified Sign-up + First Use contract (W1B-01), run: npm run test:w1b-01-account-identity-first-use-contract}
      - {name: Verify Final Account Access Lifecycle contract (W2-01), run: npm run test:w2-01-final-account-access-contract}
      - {name: Verify Production Launch Identity contract (W2-02), run: npm run test:w2-02-production-launch-identity-contract}
      - {name: Verify General Settings + Appearance + Sign Out contract (W3-01), run: npm run test:w3-01-general-settings-appearance-signout-contract}
      - {name: Verify Account & Identity + Public ID contract (W3-02), run: npm run test:w3-02-account-identity-public-id-contract}
      - {name: Verify Account & Identity completion + Security & Sign-in contract (W3-MEGA-A), run: npm run test:w3-mega-a-account-identity-security-contract}
      - {name: Verify Personal controls + Privacy & Data contract (W3-MEGA-S), run: npm run test:w3-mega-s-personal-controls-settings-contract}
      - {name: Verify Living Analysis World production visual port contract (VPORT-01), run: npm run test:vport-01-world-visual-contract}
      - {name: Verify Temporal / Orientation / P2 final coherence contract (VPORT-02), run: npm run test:vport-02-temporal-orientation-p2-contract}
      - {name: Verify A3-01 Activity & Attention Core + in-app production integration static contract, run: npm run test:a3-01-activity-attention-inapp-contract}
      - {name: "Verify A3-02 Native Push, Permission & Platform Delivery static contract", run: npm run test:a3-02-native-push-platform-delivery-contract}
      - {name: "Verify S4-01 Shared World Reachability, Invitation & Birth static contract", run: npm run test:s4-01-shared-world-reachability-contract}
      - {name: "Verify S4-02 Shared Conversation & Material static contract", run: npm run test:s4-02-shared-conversation-material-contract}
      - {name: "Verify S4-03 Shared Lifecycle & Governance static contract", run: npm run test:s4-03-shared-lifecycle-governance-contract}
      - {name: "Verify S4-04 Shared Activity, Notifications & Direct Entry static contract", run: npm run test:s4-04-shared-activity-notifications-direct-entry-contract}
      - {name: "Verify S5-01 Public Reachability, Entry & Identity static contract", run: npm run test:s5-01-public-reachability-entry-identity-contract}
      - {name: "Verify S5-02 Public Authoring, Rights, Draft / Review & Privacy static contract", run: npm run test:s5-02-public-authoring-rights-privacy-contract}
      - {name: Verify the Stage-3 proof LEG-isolation contract (A3-02), run: npm run test:a3-proof-leg-isolation-contract}
      - {name: Verify QANDEEL Understanding surface contract (W3-MEGA-U U2), run: npm run test:w3-mega-u2-understanding-surface-contract}
      - {name: Verify QANDEEL Understanding Contested / Under Review contract (W3-MEGA-U U3), run: npm run test:w3-mega-u3-contested-runtime-contract}
      - {name: Verify Session Semantic Clock / SP / LH delivery contract (T-03A2), run: npm run test:session-semantic-clock-sp-lh-delivery-contract}
      - {name: Verify the native-impact classifier, run: npm run test:mobile-native-impact-classifier}
      - {name: Verify change-aware validation + cross-run native reuse contract (VAL-01), run: npm run test:val-01-change-aware-validation-contract}
      - {name: Verify deterministic Expo SDK 57 dependency validation contract (QAN-INF-03), run: npm run test:qan-inf-03-deterministic-expo-dependency-validation-contract}
      - {name: Verify native CI build/validation decoupling contract (QAN-INF-04), run: npm run test:qan-inf-04-native-ci-artifact-reuse-contract}
      - {name: Type-check mobile (TypeScript 5.9 line), run: npm run typecheck:mobile}
      - {name: Lint mobile, run: npm run lint:mobile}
      - {name: Unit and component tests (jest-expo), run: npm run test:mobile}
      # QAN-INF-03: `EXPO_OFFLINE` makes `expo install --check` validate against the
      # deterministic `expo/bundledNativeModules.json` shipped inside the installed,
      # lockfile-pinned `expo` package instead of the mutable live registry, so a
      # previously green, unchanged commit cannot go red merely because Expo
      # publishes a newer recommended patch. `expo-doctor`'s dependency-version
      # check spawns this exact command as a subprocess and inherits this env, so it
      # is covered too; `EXPO_DOCTOR_ENABLE_DIRECTORY_CHECK: '0'` turns off its
      # separate, independently-live React Native Directory check for the same
      # reason. Real dependency compatibility is still enforced: see
      # `.github/workflows/mobile-expo-dependency-drift-advisory.yml` for the live
      # signal this intentionally no longer gates merges.
      - {name: Expo dependency validation (intentional typescript exclusion), run: npm run deps:check:mobile, env: {EXPO_OFFLINE: '1'}}
      - {name: Expo Doctor, run: npm run doctor:mobile, env: {EXPO_OFFLINE: '1', EXPO_DOCTOR_ENABLE_DIRECTORY_CHECK: '0'}}
      - {name: Prebuild idempotency gate (CNG Level 2), run: npm run prebuild:mobile}
      # W2-02: the GENERATED Android + iOS projects carry the I-08B2.5 icon bytes unchanged and the World-only
      # launch, with a planted defect proved caught for every check family. Linux generates both platforms.
      - {name: Native launch identity gate (W2-02), run: npm run prebuild:launch-identity:mobile}

  # -------------------------------------------------------------------------------------------------
  # Android — BUILD PRODUCER, then VALIDATION CONSUMER
  # -------------------------------------------------------------------------------------------------
  build-android:
    name: Android Release APK (x86_64) — BUILD PRODUCER
    needs: [plan, verify-mobile-contracts]
    # Runs unless the planner POSITIVELY said the native gate is not relevant or is carried forward, and only
    # behind a green contract gate — or a contract gate the planner carried forward.
    if: ${{ !cancelled() && needs.plan.outputs.mobile_native_binary != 'CARRY_FORWARD' && needs.plan.outputs.mobile_native_binary != 'NOT_RELEVANT' && (needs.verify-mobile-contracts.result == 'success' || (needs.verify-mobile-contracts.result == 'skipped' && needs.plan.outputs.mobile_contract == 'CARRY_FORWARD')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      # The mode the consumer must verify under. A restored artifact legitimately carries an older
      # commit, so the consumer cannot demand commit equality in that case — but it must not be left to
      # DECIDE that for itself from the artifact it is judging. The producer states it, once, here.
      provenance_mode: ${{ steps.provenance.outputs.mode }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      # QAN-INF-04 — the binary is keyed by its build inputs, not by this run.
      #
      # The fingerprint covers every tracked path that can reach the APK and excludes only the Maestro
      # flows, the runner-only `scripts/phase-m/` orchestration and prose. So a head that changed a flow,
      # a doc or a Phase-M script restores the APK an equivalent head already produced, and a head that
      # touched `apps/mobile/src`, the lockfile or the app config does not and cannot: any rule change
      # that alters the included set alters the digest, so the key is self-protecting against its own
      # drift.
      #
      # QAN-INF-04-FIX-01 — the cache is now an OPTIMIZATION ONLY. It can spare a fresh head a rebuild;
      # it is no longer what makes a flaked validation rerunnable, because its post-save is skipped
      # exactly when the job fails. That guarantee now belongs to the uploaded artifact below.
      #
      # The restore is a hint, never a licence: the provenance gate re-derives everything and refuses the
      # artifact outright if it cannot prove it. A cache miss simply builds.
      - name: Compute the build-input fingerprint
        id: fingerprint
        run: |
          value="$(node scripts/phase-m/native-build-fingerprint.mjs)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "### Android build-input fingerprint: \`$value\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore a build-compatible Release APK, if one exists
        id: native-build-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/native-build
          key: qandeel-native-android-x86_64-PRODUCT-mobile-ci-boot-smoke-v1-${{ steps.fingerprint.outputs.value }}
      # Everything from here to the provenance gate is the BUILD, and it is skipped wholesale on a hit.
      # `npm ci` is part of it: nothing after the gate needs `node_modules`, because the gate and the
      # evidence use Node builtins alone. VAL-01: so is the build JDK.
      - name: Setup Temurin JDK 17
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - {name: Install dependencies from the root lockfile, if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm ci}
      # The fast gate already proved contracts, typecheck, lint, Jest, Expo
      # dependency validation, Expo Doctor and prebuild idempotency. This job
      # exists to prove native generation and build; the consumer proves install and boot.
      - {name: Generate the Android project (CNG), if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm run prebuild:android --workspace @qandeel/mobile}
      - name: Build the Release APK (x86_64 for the emulator)
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Stage the artifact and record its identity
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          out="$RUNNER_TEMP/native-build"
          mkdir -p "$out"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$out/app-release.apk"
          node scripts/phase-m/native-artifact-manifest.mjs \
            --platform android --role PRODUCT --recipe mobile-ci-boot-smoke --abis x86_64 \
            --artifact "$out/app-release.apk" --out "$out/native-artifact-manifest.json"
      # THE GATE, on both paths, BEFORE the binary is published to the consumer. On a miss it confirms
      # what this job just built; on a hit it is the whole argument for publishing a binary this job did
      # not produce. `prior-run` is the honest mode for a restored artifact: an equal fingerprint from
      # another head is exactly the claim, and the commit is expected to differ.
      - name: Verify the artifact provenance BEFORE it is published
        id: provenance
        env:
          MODE: ${{ steps.native-build-cache.outputs.cache-hit == 'true' && 'prior-run' || 'same-run' }}
        run: |
          # `| tee` would otherwise decide this step's status, because a pipeline reports its LAST
          # command and GitHub's default shell carries no `pipefail`. A fail-closed gate that cannot
          # fail its job is not a gate.
          set -o pipefail
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/app-release.apk" \
            --mode "$MODE" --platform android --role PRODUCT \
            --recipe mobile-ci-boot-smoke --abis x86_64 --commit "${{ github.sha }}" \
            | tee "$RUNNER_TEMP/provenance.txt"
          {
            echo "### Android artifact provenance: \`$MODE\`"
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/provenance.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # THE RETRY GUARANTEE. This upload — not the cache — is what a rerun of the consumer consumes, and
      # it has already happened by the time any emulator exists to flake. `overwrite` so that re-running
      # ALL jobs replaces the artifact instead of colliding with the attempt that produced it.
      - name: Publish the verified Release APK and its identity for the validation consumer
        uses: actions/upload-artifact@v4
        with:
          name: qandeel-mobile-android-release-apk
          path: ${{ runner.temp }}/native-build
          if-no-files-found: error
          overwrite: true

  verify-android:
    name: Android (API 36 emulator boot smoke)
    needs: [plan, build-android]
    # A consumer exists to validate what ITS producer published in this run, so it runs exactly when that
    # producer succeeded.
    if: ${{ !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      # No `cache: npm` and no `npm ci`: every script this job runs uses Node builtins only. A consumer
      # that installed dependencies would be a consumer that could build.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      # VAL-01: one normal attempt and ONE classified rerun; a third unchanged attempt stops here, in seconds.
      - {name: Enforce the validation retry budget, run: 'node scripts/validation/retry-budget.mjs --attempt "${{ github.run_attempt }}"'}
      - name: Setup Temurin JDK 17 (Maestro tooling path)
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      # Resolved through the RUN's artifact API rather than the attempt-local upload channel, and that
      # is the whole point: on "re-run failed jobs" this job runs in a NEW ATTEMPT while the producer
      # does not re-run at all, so the binary it needs was uploaded by an attempt that is already over.
      # The run id is the same across attempts, so the artifact stays addressable for the retry.
      - name: Download the verified Release APK produced by this run
        uses: actions/download-artifact@v4
        with:
          name: qandeel-mobile-android-release-apk
          path: ${{ runner.temp }}/native-build
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      # An absent or empty producer output resolves to `same-run`, which is the STRICTER mode: it also
      # demands commit equality. The fallback therefore refuses a cache-restored foreign-commit artifact
      # rather than waving one through — the failure direction a lost output must take.
      - name: Verify the artifact provenance BEFORE anything is installed
        env:
          MODE: ${{ needs.build-android.outputs.provenance_mode == 'prior-run' && 'prior-run' || 'same-run' }}
        run: |
          set -o pipefail
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/app-release.apk" \
            --mode "$MODE" --platform android --role PRODUCT \
            --recipe mobile-ci-boot-smoke --abis x86_64 --commit "${{ github.sha }}" \
            | tee "$RUNNER_TEMP/provenance.txt"
          {
            echo "### Android consumer — provenance \`$MODE\`, attempt ${{ github.run_attempt }}, and NO build ran in this job"
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/provenance.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified before extraction)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Guard the Maestro version
        run: |
          maestro --version
          maestro --version 2>/dev/null | grep -qx "${MAESTRO_VERSION}"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Bounded at the STEP, not only by the job's hour: a hung Maestro launch must fail fast instead of
      # holding the runner. The bound covers emulator boot + install + smoke, so it sits above the 900 s
      # boot allowance rather than undercutting it. A timeout is a failure like any other — it stays red,
      # and a retry is still the human "re-run failed jobs" decision above, against the published artifact.
      # VAL-01: inside that bound, the Maestro driver must answer a bounded readiness probe before the flow
      # starts, and the flow itself is bounded — each by the platform-neutral watchdog, which classifies an
      # expiry as INFRASTRUCTURE and kills the process group instead of idling to the step's limit.
      - name: Boot smoke on the Android emulator (API 36, x86_64, google_apis)
        timeout-minutes: 20
        env:
          APK: ${{ runner.temp }}/native-build/app-release.apk
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-boot-timeout: 900
          script: |
            adb install -r "$APK"
            node scripts/validation/bounded-run.mjs --seconds 240 --label android-driver-readiness --quiet -- maestro hierarchy --compact
            node scripts/validation/bounded-run.mjs --seconds 300 --label android-boot-smoke -- maestro test apps/mobile/.maestro/boot-smoke.yaml

  # -------------------------------------------------------------------------------------------------
  # iOS — BUILD PRODUCER, then VALIDATION CONSUMER
  # -------------------------------------------------------------------------------------------------
  build-ios:
    name: iOS Release simulator app — BUILD PRODUCER
    needs: [plan, verify-mobile-contracts]
    # Runs unless the planner POSITIVELY said the native gate is not relevant or is carried forward, and only
    # behind a green contract gate — or a contract gate the planner carried forward.
    if: ${{ !cancelled() && needs.plan.outputs.mobile_native_binary != 'CARRY_FORWARD' && needs.plan.outputs.mobile_native_binary != 'NOT_RELEVANT' && (needs.verify-mobile-contracts.result == 'success' || (needs.verify-mobile-contracts.result == 'skipped' && needs.plan.outputs.mobile_contract == 'CARRY_FORWARD')) }}
    runs-on: macos-26
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # Recorded INTO the manifest by `describeTarget`, and re-asserted by the consumer against its own
      # values. The two jobs must therefore name the same device, and they do, here and below.
      IOS_SIMULATOR_NAME: iPhone 17
      IOS_SIMULATOR_RUNTIME_SUFFIX: iOS-26-5
    outputs:
      provenance_mode: ${{ steps.provenance.outputs.mode }}
      fingerprint: ${{ steps.fingerprint.outputs.value }}
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Select Xcode 26.6 explicitly (never the runner default)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version
          xcodebuild -version | grep -x 'Xcode 26.6'
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      # QAN-INF-04 — the same build-input key as the Android producer, for the same reason, at seventeen
      # minutes a rebuild instead of ten. See that job for why the key is self-protecting, and for why
      # QAN-INF-04-FIX-01 demoted it to an optimization.
      - name: Compute the build-input fingerprint
        id: fingerprint
        run: |
          value="$(node scripts/phase-m/native-build-fingerprint.mjs)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "### iOS build-input fingerprint: \`$value\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore a build-compatible Release simulator app, if one exists
        id: native-build-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/native-build
          key: qandeel-native-ios-simulator-PRODUCT-mobile-ci-boot-smoke-v1-${{ steps.fingerprint.outputs.value }}
      - {name: Install dependencies from the root lockfile, if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm ci}
      - {name: Generate the iOS project (CNG), if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm run prebuild:ios --workspace @qandeel/mobile}
      - name: Install CocoaPods dependencies
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build the Release simulator app
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          workspace="$(ls -d apps/mobile/ios/*.xcworkspace | head -n 1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          echo "workspace=$workspace scheme=$scheme"
          xcodebuild -quiet -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath apps/mobile/ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      # Packaged before it is published, not after: the archive is what the consumer installs, so the
      # bytes validated here are the bytes a reuse validates there.
      - name: Package the simulator app and record its identity
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          out="$RUNNER_TEMP/native-build"
          mkdir -p "$out"
          app="$(find apps/mobile/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$app"
          ditto -c -k --keepParent "$app" "$out/qandeel-ios-simulator.app.zip"
          node scripts/phase-m/native-artifact-manifest.mjs \
            --platform ios --role PRODUCT --recipe mobile-ci-boot-smoke \
            --artifact "$out/qandeel-ios-simulator.app.zip" --out "$out/native-artifact-manifest.json"
      - name: Verify the artifact provenance BEFORE it is published
        id: provenance
        env:
          MODE: ${{ steps.native-build-cache.outputs.cache-hit == 'true' && 'prior-run' || 'same-run' }}
        run: |
          set -o pipefail
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/qandeel-ios-simulator.app.zip" \
            --mode "$MODE" --platform ios --role PRODUCT \
            --recipe mobile-ci-boot-smoke --commit "${{ github.sha }}" \
            | tee "$RUNNER_TEMP/provenance.txt"
          {
            echo "### iOS artifact provenance: \`$MODE\`"
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/provenance.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish the verified simulator app and its identity for the validation consumer
        uses: actions/upload-artifact@v4
        with:
          name: qandeel-mobile-ios-simulator-app
          path: ${{ runner.temp }}/native-build
          if-no-files-found: error
          overwrite: true

  verify-ios:
    name: iOS (iPhone 17 / iOS 26.5 simulator boot smoke)
    needs: [plan, build-ios]
    if: ${{ !cancelled() && needs.build-ios.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_SIMULATOR_NAME: iPhone 17
      IOS_SIMULATOR_RUNTIME_SUFFIX: iOS-26-5
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      # VAL-01: one normal attempt and ONE classified rerun; a third unchanged attempt stops here, in seconds.
      - {name: Enforce the validation retry budget, run: 'node scripts/validation/retry-budget.mjs --attempt "${{ github.run_attempt }}"'}
      # Selected and READ BACK, never confirmed with `xcodebuild`: this job may not invoke that binary
      # at all, and a guard that did would make the no-build claim unverifiable by inspection.
      - name: Select Xcode 26.6 explicitly (never the runner default)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          test "$(xcode-select -p)" = '/Applications/Xcode_26.6.app/Contents/Developer'
      - name: Guard the simulator (iPhone 17 on iOS 26.5)
        run: |
          xcrun simctl list runtimes
          udid="$(xcrun simctl list devices available -j | jq -r --arg name "$IOS_SIMULATOR_NAME" --arg suffix "$IOS_SIMULATOR_RUNTIME_SUFFIX" '.devices | to_entries[] | select(.key | endswith($suffix)) | .value[] | select(.name == $name) | .udid' | head -n 1)"
          if [ -z "$udid" ]; then
            echo "STOP: the authorized simulator (${IOS_SIMULATOR_NAME} / ${IOS_SIMULATOR_RUNTIME_SUFFIX}) is not on this image"
            xcrun simctl list devices available
            exit 1
          fi
          echo "IOS_SIM_UDID=$udid" >> "$GITHUB_ENV"
          echo "simulator udid: $udid"
      - name: Setup Temurin JDK 17 (Maestro tooling path)
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - name: Download the verified simulator app produced by this run
        uses: actions/download-artifact@v4
        with:
          name: qandeel-mobile-ios-simulator-app
          path: ${{ runner.temp }}/native-build
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the artifact provenance BEFORE anything is installed
        env:
          MODE: ${{ needs.build-ios.outputs.provenance_mode == 'prior-run' && 'prior-run' || 'same-run' }}
        run: |
          set -o pipefail
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/qandeel-ios-simulator.app.zip" \
            --mode "$MODE" --platform ios --role PRODUCT \
            --recipe mobile-ci-boot-smoke --commit "${{ github.sha }}" \
            | tee "$RUNNER_TEMP/provenance.txt"
          {
            echo "### iOS consumer — provenance \`$MODE\`, attempt ${{ github.run_attempt }}, and NO build ran in this job"
            echo ''
            echo '```'
            cat "$RUNNER_TEMP/provenance.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Boot the simulator and install the verified app
        run: |
          xcrun simctl boot "$IOS_SIM_UDID" || true
          node scripts/validation/bounded-run.mjs --seconds 300 --label ios-simulator-boot -- xcrun simctl bootstatus "$IOS_SIM_UDID" -b
          ditto -x -k "$RUNNER_TEMP/native-build/qandeel-ios-simulator.app.zip" "$RUNNER_TEMP/native-app"
          app="$(find "$RUNNER_TEMP/native-app" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$app"
          xcrun simctl install "$IOS_SIM_UDID" "$app"
          echo "IOS_APP_PATH=$app" >> "$GITHUB_ENV"
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified before extraction)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | shasum -a 256 --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Guard the Maestro version
        run: |
          maestro --version
          maestro --version 2>/dev/null | grep -qx "${MAESTRO_VERSION}"
      # VAL-01: the XCTest driver must answer before the flow starts. A dead driver is classified INFRASTRUCTURE
      # here in at most five minutes, instead of a smoke that idles to its limit with no Product step run.
      - name: Maestro driver readiness (bounded)
        timeout-minutes: 6
        run: node scripts/validation/bounded-run.mjs --seconds 300 --label ios-driver-readiness --quiet -- maestro --device "$IOS_SIM_UDID" hierarchy --compact
      # Bounded at the STEP for the same reason. The simulator is already booted and the verified app
      # already installed, so this bounds the Maestro smoke alone; a timeout stays red, like any failure.
      - name: Boot smoke on the iOS simulator
        timeout-minutes: 15
        run: node scripts/validation/bounded-run.mjs --seconds 780 --label ios-boot-smoke -- maestro --device "$IOS_SIM_UDID" test apps/mobile/.maestro/boot-smoke.yaml

  # -------------------------------------------------------------------------------------------------
  # VAL-01 — bound contracts and evidence
  # -------------------------------------------------------------------------------------------------
  # A MOBILE_CONTRACT carry-forward still re-runs, at THIS head, every root contract of this workflow that can
  # read a path the update changed (a doc, a flow, a proof runner) — e.g. QAN-INF-04's flow-parse gate after a
  # Maestro edit. The typecheck / lint / Jest / Expo / prebuild gates read none of those paths, and carry.
  mobile-bound-contracts:
    name: Mobile contracts that read the changed paths (VAL-01)
    needs: [plan]
    if: ${{ needs.plan.outputs.mobile_contract == 'CARRY_FORWARD' && needs.plan.outputs.mobile_contract_contracts != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - {name: Install dependencies from the root lockfile, run: npm ci}
      - name: Run the bound root contracts
        env: {CONTRACTS: '${{ needs.plan.outputs.mobile_contract_contracts }}'}
        run: |
          echo "### Mobile contracts re-run at this head (VAL-01)" >> "$GITHUB_STEP_SUMMARY"
          for contract in $CONTRACTS; do echo "- \`$contract\`" >> "$GITHUB_STEP_SUMMARY"; done
          node --test $CONTRACTS

  # The verdict of each gate for THIS head, recorded only when green; read by the next PR head before it may
  # carry anything forward (scripts/validation/change-planner.mjs `validateEvidence`).
  evidence:
    name: Validation evidence (VAL-01)
    needs: [plan, verify-mobile-contracts, mobile-bound-contracts, verify-android, verify-ios]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Record the contract gate's evidence for this head
        run: >-
          node scripts/validation/plan-validation.mjs record --workflow mobile-ci --gate MOBILE_CONTRACT
          --decision "${{ needs.plan.outputs.mobile_contract || 'RUN' }}"
          --gate-result "${{ needs.verify-mobile-contracts.result }}"
          --bound-result "${{ needs.mobile-bound-contracts.result }}"
          --contracts "${{ needs.plan.outputs.mobile_contract_contracts }}"
          --source-run-id "${{ needs.plan.outputs.mobile_contract_source_run_id }}"
          --source-head-sha "${{ needs.plan.outputs.mobile_contract_source_head_sha }}"
          --out "$RUNNER_TEMP/val01-evidence"
      - name: Record the native gate's evidence for this head
        if: ${{ !cancelled() }}
        run: >-
          node scripts/validation/plan-validation.mjs record --workflow mobile-ci --gate MOBILE_NATIVE_BINARY
          --decision "${{ needs.plan.outputs.mobile_native_binary || 'RUN' }}"
          --gate-result "${{ (needs.verify-android.result == 'success' && needs.verify-ios.result == 'success') && 'success' || 'failure' }}"
          --bound-result skipped --contracts ''
          --source-run-id "${{ needs.plan.outputs.mobile_native_binary_source_run_id }}"
          --source-head-sha "${{ needs.plan.outputs.mobile_native_binary_source_head_sha }}"
          --out "$RUNNER_TEMP/val01-evidence"
      - name: Publish the contract gate's evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: val01-evidence-mobile-ci-MOBILE_CONTRACT
          path: ${{ runner.temp }}/val01-evidence/MOBILE_CONTRACT/evidence.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - name: Publish the native gate's evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: val01-evidence-mobile-ci-MOBILE_NATIVE_BINARY
          path: ${{ runner.temp }}/val01-evidence/MOBILE_NATIVE_BINARY/evidence.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
