# COSMOS-INT-01 Slice E iOS baseline (VALIDATION ONLY, no PR): does a tap on a COSMOS node reach the app on iOS?
# The baseline audit (run 44185138506) taps node cores with Maestro and sees no PEEK / detail sheet. This job taps the
# same node through Maestro (XCTest) and through idb (HID touches), on the same checksummed proof build, so the report
# can classify the finding as APPLICATION or TEST AUTOMATION. A separate branch, so it never cancels the audit run.
name: cosmos-slice-e-ios-tap-probe
on:
  push:
    branches: ['cosmos/slice-e-ios-baseline-probe', 'cosmos/slice-e-ios-baseline-probe5']
concurrency:
  group: cosmos-slice-e-ios-tap-probe-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
env:
  CI: 1
  EXPO_NO_TELEMETRY: 1
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_VERSION: 2.10.0
  MAESTRO_ZIP_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
  BASELINE_COMMIT: 03d1b3ea1dd4fddbd4801ff322bed88385998e74
  PROOF_RUN_ID: '44080247611'
  IOS_RUNTIME_SUFFIX: iOS-26-5
jobs:
  probe:
    if: ${{ !contains(github.event.head_commit.message, '[sheet-only]') }}
    name: iOS probe 5 — ${{ matrix.size }} ${{ matrix.lang }} ${{ matrix.unit }}
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Probe 5: the audit's enlarged and landscape scenes, with the harness fixes (return to the Conversation before a
        # World switch; the second focus tap re-aimed; Public added to landscape). Same proof binary, same scripts otherwise.
        include:
          - {size: small, lang: ar, langtag: ar-EG, langloc: ar_EG, device: 'iPhone SE (3rd generation)|iPhone 16e|iPhone 13 mini', unit: enlarged}
          - {size: medium, lang: en, langtag: en-US, langloc: en_US, device: 'iPhone 17', unit: landscape}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      MAESTRO_DRIVER_STARTUP_TIMEOUT: 300000
      MAESTRO_IOS_DRIVER_PORT: 22087
    steps:
      - {name: Checkout, uses: actions/checkout@v4, with: {fetch-depth: 0}}
      - name: Refuse unless the application is byte-identical to the baseline commit
        run: |
          git diff --stat "$BASELINE_COMMIT" HEAD -- apps/ package.json package-lock.json | tee "$RUNNER_TEMP/app-diff.txt"
          test ! -s "$RUNNER_TEMP/app-diff.txt"
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - {name: Install the harness's PNG reader (root lockfile), run: npm ci --ignore-scripts}
      - name: Setup Temurin JDK 17 (Maestro)
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - uses: actions/download-artifact@v4
        with: {name: cosmos-ios-proof-app, path: '${{ runner.temp }}/proof-app', run-id: '${{ env.PROOF_RUN_ID }}', github-token: '${{ github.token }}'}
      - name: Boot the simulator
        env: {CANDIDATES: '${{ matrix.device }}'}
        run: bash scripts/cosmos-slice-e-ios/sim.sh "$CANDIDATES" "$RUNNER_TEMP/evidence"
      - name: Install the proof app (checksum recorded)
        run: |
          cd "$RUNNER_TEMP/proof-app" && shasum -a 256 -c sha256.txt && ditto -x -k qandeel-ios-proof.app.zip .
          app="$(find "$RUNNER_TEMP/proof-app" -maxdepth 1 -name '*.app' | head -n 1)"
          xcrun simctl install "$IOS_SIM_UDID" "$app"
          cp "$RUNNER_TEMP/proof-app/"*.txt "$RUNNER_TEMP/evidence/"
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | shasum -a 256 --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro" && cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Set the simulator language and prove the driver
        env: {LANGTAG: '${{ matrix.langtag }}', LANGLOC: '${{ matrix.langloc }}', LANGX: '${{ matrix.lang }}'}
        run: bash scripts/cosmos-slice-e-ios/run-ios-audit.sh proof "$RUNNER_TEMP/evidence" "$IOS_SIM_UDID" "${{ matrix.size }}-${{ matrix.lang }}" setup
      - name: Scene
        timeout-minutes: 50
        env: {LANGX: '${{ matrix.lang }}'}
        run: bash scripts/cosmos-slice-e-ios/run-ios-audit.sh proof "$RUNNER_TEMP/evidence" "$IOS_SIM_UDID" "${{ matrix.size }}-${{ matrix.lang }}" "${{ matrix.unit }}" || true
      - name: Contact sheet on the runner (screenshots only; the slow local link cannot take the raw evidence)
        if: ${{ !cancelled() }}
        run: |
          brew install imagemagick > /dev/null 2>&1 || true
          d="$RUNNER_TEMP/evidence/${{ matrix.lang }}/${{ matrix.unit }}"; out="$RUNNER_TEMP/sheet"; mkdir -p "$out"
          cp "$RUNNER_TEMP/evidence/"*.tsv "$RUNNER_TEMP/evidence/runner.log" "$out/" 2>/dev/null || true
          cd "$d" && args=(); for f in $(ls *.png | sort); do args+=(-label "${f%.png}" "$f"); done
          magick montage "${args[@]}" -geometry 300x+4+4 -tile 6x -pointsize 18 -quality 70 "$out/sheet.jpg" || montage "${args[@]}" -geometry 300x+4+4 -tile 6x -pointsize 18 -quality 70 "$out/sheet.jpg"
          ls -la "$out"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: 'cosmos-ios-probe5-sheet-${{ matrix.size }}-${{ matrix.lang }}-${{ matrix.unit }}', path: '${{ runner.temp }}/sheet', if-no-files-found: warn}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: {name: 'cosmos-ios-probe5-${{ matrix.size }}-${{ matrix.lang }}-${{ matrix.unit }}', path: '${{ runner.temp }}/evidence', if-no-files-found: warn}
