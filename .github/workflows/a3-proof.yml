name: A3 proof — Activity, attention and native push
# Stage 3 (A3-01 + A3-02) — the device proof of Activity, in-app attention and platform delivery, on the production
# route. VALIDATION ONLY.
#
# A3-02 REPLACED the A3-01 shape (one job that built the APK and then ran all nine legs one after another, so one failed
# leg made GitHub's "Re-run failed jobs" rebuild the APK and rerun every leg that had passed). The binding shape now
# (A3-02 Task Contract §10; pinned by tests/a3-proof-leg-isolation-contract.test.mjs):
#
#   plan  ──►  build-android  ──►  android-leg × N   (matrix: one leg per job, fail-fast off, own emulator, own evidence)
#        └──►  build-ios      ──►  ios-leg × N
#
#   - a BUILD PRODUCER publishes the proof binary ONCE per platform with its identity manifest (role PROOF_VALIDATION,
#     recipe a3-activity-push-proof);
#   - each LEG CONSUMER downloads that artifact, re-proves its provenance BEFORE installing it, boots its OWN emulator /
#     simulator, runs exactly ONE leg (scripts/a3/run-proof-leg.sh <apk> <leg>), and uploads only its own evidence.
#     A consumer contains no Gradle, no xcodebuild, no pod install, no prebuild and no npm ci;
#   - "Re-run failed jobs" therefore reruns only the failed leg(s): the succeeded producer is not rerun, the failed leg
#     downloads the same producer artifact (artifacts belong to the run, across attempts) and nothing is rebuilt.
#
# VAL-01 — the reference implementation of change-aware proof (pinned by tests/val-01-change-aware-validation-contract.test.mjs):
#
#   - CROSS-RUN REUSE. The producer keys the binary by the canonical native build-input fingerprint
#     (scripts/phase-m/native-build-fingerprint.mjs) + platform + role + recipe/version + target. On a hit it runs NO
#     npm ci, NO prebuild, NO Gradle, NO CocoaPods and NO Xcode build: it re-proves the restored manifest `prior-run`
#     and publishes THAT binary for this run's consumers. On a miss it builds once, verifies `same-run`, publishes, and
#     the cache keeps it for the next equivalent head. A Maestro flow, a leg runner or a doc cannot move the
#     fingerprint, so a flow fix never rebuilds; a Product, bundled-harness, lockfile or workflow change always does.
#   - LEG SELECTION. `plan` maps the change to the legs that consume it (scripts/validation/proof-legs.mjs, derived
#     from the runners themselves): one changed flow runs only the leg(s) whose flows reach it; a shared readiness
#     flow, a runner or a binary input runs every leg of that platform; a manual dispatch with no `since_sha` runs
#     every leg. A platform with no selected leg builds nothing.
#   - BOUNDED. Each leg consumer enforces the retry budget (one classified rerun) and the runners wrap every Maestro
#     invocation, and a driver-readiness probe, in the platform-neutral watchdog.
#   - PHYSICAL HARDWARE. Every leg here is SIMULATOR_PROVABLE; the physical-device-only facts (A3-02 record §20,
#     QAN-BL-NOTIF-05) are declared in scripts/validation/proof-suites.mjs and never scheduled here.
#
# The binary's ROOT COMPONENT is the A3 proof root (one recorded change of the mobile manifest's `main`, made by
# `select-a301-proof-entry.mjs` in this ephemeral checkout only). No credential exists in this workflow: no FCM / APNs
# key, no Firebase configuration, no API origin. Real remote delivery is a named physical-device Exit Gate (A3-02
# record §20), never claimed here.
#
# Scoped to the A3-02 branch and manual dispatch: it proves those heads and is inert everywhere else.
on:
  push:
    branches: ['feat/a3-02-native-push-platform-delivery']
    paths:
      - 'apps/mobile/**'
      - 'scripts/a3/**'
      - 'scripts/phase-m/**'
      - 'scripts/validation/**'
      - 'package-lock.json'
      - '.github/workflows/a3-proof.yml'
  workflow_dispatch:
    inputs:
      since_sha:
        description: 'Select only the legs affected by the changes since this commit. Empty = every leg.'
        required: false
        type: string
        default: ''
concurrency:
  group: a3-proof-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: 1
  EXPO_NO_TELEMETRY: 1
  MAESTRO_CLI_NO_ANALYTICS: 1
  MAESTRO_VERSION: 2.10.0
  MAESTRO_ZIP_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
jobs:
  plan:
    name: Leg selection (VAL-01)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      android_legs: ${{ steps.legs.outputs.android_legs }}
      ios_legs: ${{ steps.legs.outputs.ios_legs }}
    steps:
      - {name: Checkout, uses: actions/checkout@v4, with: {fetch-depth: 0}}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Select the legs the change can affect
        id: legs
        env: {SINCE_SHA: '${{ inputs.since_sha }}'}
        run: node scripts/validation/plan-validation.mjs legs --suite a3 --since "$SINCE_SHA"

  build-android:
    name: Android x86_64 Release proof binary — BUILD PRODUCER
    needs: [plan]
    if: ${{ needs.plan.outputs.android_legs != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      provenance_mode: ${{ steps.provenance.outputs.mode }}
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Compute the build-input fingerprint
        id: fingerprint
        run: |
          value="$(node scripts/phase-m/native-build-fingerprint.mjs)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "### Android proof build-input fingerprint: \`$value\`" >> "$GITHUB_STEP_SUMMARY"
      # The restore is a hint, never a licence: the provenance gate below re-derives everything and refuses the binary
      # outright if it cannot prove it. A miss simply builds.
      - name: Restore an equivalent proof binary from a prior run, if one exists
        id: native-build-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/native-build
          key: qandeel-native-android-x86_64-PROOF_VALIDATION-a3-activity-push-proof-v1-${{ steps.fingerprint.outputs.value }}
      # Everything from here to the provenance gate is the BUILD, and it is skipped wholesale on a hit.
      - name: Setup Temurin JDK 17
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - {name: Install dependencies from the root lockfile, if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm ci}
      - name: Confirm the generated world, P2 and P3 geometry are current (the build ships exactly the generated constants)
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          node apps/mobile/scripts/generate-world-visual.mjs --check
          node apps/mobile/scripts/generate-p2-production.mjs --check
          node apps/mobile/scripts/generate-p3-production.mjs --check
      - name: Select the A3 proof entry (the one recorded difference from the Product build)
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        env: {A301_INAPP_PROOF: '1'}
        run: |
          node apps/mobile/scripts/select-a301-proof-entry.mjs --apply
          echo "### A3 proof build — main: \`$(node -p "require('./apps/mobile/package.json').main")\`, commit \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
      - {name: Generate the Android project (CNG), if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm run prebuild:android --workspace @qandeel/mobile}
      - name: Build the Release APK ONCE (x86_64 for the emulator)
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Stage the artifact and record its identity
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          out="$RUNNER_TEMP/native-build"
          mkdir -p "$out"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "$out/app-release.apk"
          node scripts/phase-m/native-artifact-manifest.mjs \
            --platform android --role PROOF_VALIDATION --recipe a3-activity-push-proof --abis x86_64 \
            --artifact "$out/app-release.apk" --out "$out/native-artifact-manifest.json"
      # THE GATE, on both paths, BEFORE the binary is published. `prior-run` is the honest mode for a restored binary:
      # an equal fingerprint from another head is exactly the claim, and the commit is expected to differ.
      - name: Verify the artifact provenance BEFORE it is published
        id: provenance
        env:
          MODE: ${{ steps.native-build-cache.outputs.cache-hit == 'true' && 'prior-run' || 'same-run' }}
        run: |
          set -o pipefail
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/app-release.apk" \
            --mode "$MODE" --platform android --role PROOF_VALIDATION \
            --recipe a3-activity-push-proof --abis x86_64 --commit "${{ github.sha }}" \
            | tee "$RUNNER_TEMP/provenance.txt"
          { echo "### Android proof producer — provenance \`$MODE\`"; echo '```'; cat "$RUNNER_TEMP/provenance.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the Android proof build
        uses: actions/upload-artifact@v4
        with:
          name: a3-proof-android-build
          path: ${{ runner.temp }}/native-build
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  android-leg:
    name: Android leg ${{ matrix.leg }} — LEG CONSUMER (no build)
    needs: [plan, build-android]
    if: ${{ !cancelled() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # VAL-01: the legs `plan` selected for this change. The full set — the nine A3-01 semantic legs and the four
        # A3-02 platform-delivery legs — is the runner's own `case "$LEG"` list, pinned by the leg-isolation contract.
        leg: ${{ fromJSON(needs.plan.outputs.android_legs) }}
    permissions:
      contents: read
      actions: read
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      # No `npm ci`, no build tool: every script below uses Node builtins only.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - {name: Enforce the validation retry budget, run: 'node scripts/validation/retry-budget.mjs --attempt "${{ github.run_attempt }}"'}
      - name: Setup Temurin JDK 17 (Maestro tooling path)
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - name: Download the Android proof build of THIS run
        uses: actions/download-artifact@v4
        with:
          name: a3-proof-android-build
          path: ${{ runner.temp }}/native-build
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      # The mode is the one the PRODUCER declared; an absent output resolves to the stricter `same-run`.
      - name: Verify the artifact provenance BEFORE anything is installed
        env:
          MODE: ${{ needs.build-android.outputs.provenance_mode == 'prior-run' && 'prior-run' || 'same-run' }}
        run: |
          set -o pipefail
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/app-release.apk" \
            --mode "$MODE" --platform android --role PROOF_VALIDATION \
            --recipe a3-activity-push-proof --abis x86_64 --commit "${{ github.sha }}" \
            | tee "$RUNNER_TEMP/provenance.txt"
          { echo "### Leg \`${{ matrix.leg }}\` — provenance \`$MODE\` verified; NO build ran in this job"; echo '```'; cat "$RUNNER_TEMP/provenance.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified before extraction)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run ONE leg on its own Android API 36 emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2.38.0
        env:
          APK: ${{ runner.temp }}/native-build/app-release.apk
          LEG: ${{ matrix.leg }}
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-boot-timeout: 900
          script: bash scripts/a3/run-proof-leg.sh "$APK" "$LEG" "$RUNNER_TEMP/leg-evidence"
      - name: Upload this leg's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3-proof-${{ matrix.leg }}-${{ github.sha }}
          path: ${{ runner.temp }}/leg-evidence
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: true

  build-ios:
    name: iOS Release simulator proof binary — BUILD PRODUCER
    needs: [plan]
    if: ${{ needs.plan.outputs.ios_legs != '[]' }}
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      provenance_mode: ${{ steps.provenance.outputs.mode }}
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_SIMULATOR_NAME: iPhone 17
      IOS_SIMULATOR_RUNTIME_SUFFIX: iOS-26-5
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Select Xcode 26.6 explicitly (never the runner default)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          test "$(xcode-select -p)" = '/Applications/Xcode_26.6.app/Contents/Developer'
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Compute the build-input fingerprint
        id: fingerprint
        run: |
          value="$(node scripts/phase-m/native-build-fingerprint.mjs)"
          echo "value=$value" >> "$GITHUB_OUTPUT"
          echo "### iOS proof build-input fingerprint: \`$value\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Restore an equivalent proof binary from a prior run, if one exists
        id: native-build-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/native-build
          key: qandeel-native-ios-simulator-iPhone-17-iOS-26-5-PROOF_VALIDATION-a3-activity-push-proof-v1-${{ steps.fingerprint.outputs.value }}
      - name: Confirm the build toolchain is Xcode 26.6
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: xcodebuild -version | grep -x 'Xcode 26.6'
      - {name: Install dependencies from the root lockfile, if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm ci}
      - name: Select the A3 proof entry (the one recorded difference from the Product build)
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        env: {A301_INAPP_PROOF: '1'}
        run: node apps/mobile/scripts/select-a301-proof-entry.mjs --apply
      - {name: Generate the iOS project (CNG), if: steps.native-build-cache.outputs.cache-hit != 'true', run: npm run prebuild:ios --workspace @qandeel/mobile}
      - name: Install CocoaPods dependencies
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        working-directory: apps/mobile/ios
        run: pod install
      - name: Build the Release simulator app ONCE
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          workspace="$(ls -d apps/mobile/ios/*.xcworkspace | head -n 1)"
          scheme="$(basename "$workspace" .xcworkspace)"
          xcodebuild -quiet -workspace "$workspace" -scheme "$scheme" -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath apps/mobile/ios/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"
      - name: Package the simulator app and record its identity
        if: steps.native-build-cache.outputs.cache-hit != 'true'
        run: |
          out="$RUNNER_TEMP/native-build"
          mkdir -p "$out"
          app="$(find apps/mobile/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$app"
          ditto -c -k --keepParent "$app" "$out/qandeel-ios-simulator.app.zip"
          node scripts/phase-m/native-artifact-manifest.mjs \
            --platform ios --role PROOF_VALIDATION --recipe a3-activity-push-proof \
            --artifact "$out/qandeel-ios-simulator.app.zip" --out "$out/native-artifact-manifest.json"
      - name: Verify the artifact provenance BEFORE it is published
        id: provenance
        env:
          MODE: ${{ steps.native-build-cache.outputs.cache-hit == 'true' && 'prior-run' || 'same-run' }}
        run: |
          set -o pipefail
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/qandeel-ios-simulator.app.zip" \
            --mode "$MODE" --platform ios --role PROOF_VALIDATION \
            --recipe a3-activity-push-proof --commit "${{ github.sha }}" \
            | tee "$RUNNER_TEMP/provenance.txt"
          { echo "### iOS proof producer — provenance \`$MODE\`"; echo '```'; cat "$RUNNER_TEMP/provenance.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the iOS proof build
        uses: actions/upload-artifact@v4
        with:
          name: a3-proof-ios-build
          path: ${{ runner.temp }}/native-build
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  ios-leg:
    name: iOS leg ${{ matrix.leg }} — LEG CONSUMER (no build)
    needs: [plan, build-ios]
    if: ${{ !cancelled() && needs.build-ios.result == 'success' }}
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A3-02 — iOS mechanics differ (authorization alert, APNs payload, presentation): one leg covers them.
        leg: ${{ fromJSON(needs.plan.outputs.ios_legs) }}
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      IOS_SIMULATOR_NAME: iPhone 17
      IOS_SIMULATOR_RUNTIME_SUFFIX: iOS-26-5
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22'}
      - {name: Enforce the validation retry budget, run: 'node scripts/validation/retry-budget.mjs --attempt "${{ github.run_attempt }}"'}
      - name: Select Xcode 26.6 explicitly (read back, never invoked)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          test "$(xcode-select -p)" = '/Applications/Xcode_26.6.app/Contents/Developer'
      - name: Guard the simulator (iPhone 17 on iOS 26.5)
        run: |
          udid="$(xcrun simctl list devices available -j | jq -r --arg name "$IOS_SIMULATOR_NAME" --arg suffix "$IOS_SIMULATOR_RUNTIME_SUFFIX" '.devices | to_entries[] | select(.key | endswith($suffix)) | .value[] | select(.name == $name) | .udid' | head -n 1)"
          if [ -z "$udid" ]; then echo "STOP: the authorized simulator is not on this image"; exit 1; fi
          echo "IOS_SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: Setup Temurin JDK 17 (Maestro tooling path)
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - name: Download the iOS proof build of THIS run
        uses: actions/download-artifact@v4
        with:
          name: a3-proof-ios-build
          path: ${{ runner.temp }}/native-build
          run-id: ${{ github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify the artifact provenance BEFORE anything is installed
        env:
          MODE: ${{ needs.build-ios.outputs.provenance_mode == 'prior-run' && 'prior-run' || 'same-run' }}
        run: |
          set -o pipefail
          node scripts/phase-m/verify-native-artifact-manifest.mjs \
            --manifest "$RUNNER_TEMP/native-build/native-artifact-manifest.json" \
            --artifact "$RUNNER_TEMP/native-build/qandeel-ios-simulator.app.zip" \
            --mode "$MODE" --platform ios --role PROOF_VALIDATION \
            --recipe a3-activity-push-proof --commit "${{ github.sha }}" \
            | tee "$RUNNER_TEMP/provenance.txt"
      - name: Unpack the verified app and boot the simulator
        run: |
          xcrun simctl boot "$IOS_SIM_UDID" || true
          ditto -x -k "$RUNNER_TEMP/native-build/qandeel-ios-simulator.app.zip" "$RUNNER_TEMP/native-app"
          app="$(find "$RUNNER_TEMP/native-app" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$app"
          echo "IOS_APP=$app" >> "$GITHUB_ENV"
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified before extraction)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | shasum -a 256 --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Run ONE leg on the simulator
        timeout-minutes: 45
        env:
          LEG: ${{ matrix.leg }}
        run: bash scripts/a3/run-ios-proof-leg.sh "$IOS_APP" "$LEG" "$RUNNER_TEMP/leg-evidence" "$IOS_SIM_UDID"
      - name: Upload this leg's evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a3-proof-${{ matrix.leg }}-${{ github.sha }}
          path: ${{ runner.temp }}/leg-evidence
          if-no-files-found: warn
          include-hidden-files: true
          overwrite: true
