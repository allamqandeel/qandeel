name: API CI
on:
  pull_request:
    paths: ['apps/api/**','database/**','tests/**','package.json','package-lock.json','tsconfig.base.json','.github/workflows/api-ci.yml']
  push:
    branches: [main]
jobs:
  verify-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: qandeel_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d qandeel_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qandeel_test
      PGPASSWORD: postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - {name: Install dependencies, run: npm ci}
      - {name: Verify npm-only toolchain contract, run: npm run test:toolchain}
      - {name: Verify A2 E2E runtime smoke static contract, run: npm run test:a2-e2e-smoke-contract}
      - {name: Verify Full Intelligence E2E runtime static contract, run: npm run test:full-intelligence-e2e-runtime-contract}
      - {name: Verify cross-context foreground application transport static contract, run: npm run test:cross-context-foreground-application-transport-contract}
      - {name: Verify explicit session context activation entry static contract, run: npm run test:explicit-session-context-activation-entry-contract}
      - {name: Verify HIM Brain Context bridge application static contract, run: npm run test:him-brain-context-bridge-contract}
      - {name: Verify Human Intelligence provider semantics consolidation static contract, run: npm run test:human-intelligence-provider-semantics-consolidation-contract}
      - {name: Verify HIM generic application write authority retirement static contract, run: npm run test:him-generic-write-authority-retirement-contract}
      - {name: Verify HIM structured-measurement preflight, run: npm run verify:him-measurement-preflight}
      - {name: Verify Foundation integration / regression gate, run: npm run verify:foundation-integration-gate}
      - name: Bootstrap fresh Supabase-compatible PostgreSQL roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT (nullif(current_setting('request.jwt.claims', true), '')::jsonb->>'sub')::uuid
          $$;
          ALTER FUNCTION auth.uid() OWNER TO postgres;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated;
          SQL
      - name: Apply all migrations to fresh PostgreSQL
        run: for migration in database/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - {name: Verify authenticated database foundation, run: npm run verify:database:integration}
      - {name: Verify conversation authority hardening, run: npm run verify:conversation-authority:integration}
      - {name: Verify conversation session authority hardening, run: npm run verify:conversation-session-authority:integration}
      - {name: Verify foreground GENERATING turn recovery, run: npm run verify:foreground-generating-turn-recovery:integration}
      - {name: Verify Memory runtime, run: npm run verify:memory:integration}
      - {name: Verify Memory authority hardening, run: npm run verify:memory-authority:integration}
      - {name: Verify Hypothesis runtime, run: npm run verify:hypothesis:integration}
      - {name: Verify Hypothesis authority hardening, run: npm run verify:hypothesis-authority:integration}
      - {name: Verify canonical Evidence eligibility, run: npm run verify:canonical-evidence:integration}
      - {name: Verify Confidence runtime, run: npm run verify:confidence:integration}
      - {name: Verify Question runtime, run: npm run verify:question:integration}
      - {name: Verify Hypothesis update runtime, run: npm run verify:hypothesis-update:integration}
      - {name: Verify HIM foundation runtime, run: npm run verify:him:integration}
      - {name: Verify Initial HIM against real PostgreSQL, run: npm run verify:initial-him:integration}
      - {name: Verify HIM calculation/calibration historical runtime, run: npm run verify:him-calculation:integration}
      - {name: Verify active HSE Energy model against real PostgreSQL, run: npm run verify:hse-energy:integration}
      - {name: Verify active HSE Motivation model against real PostgreSQL, run: npm run verify:hse-motivation:integration}
      - {name: Verify active HSE Attention model against real PostgreSQL, run: npm run verify:hse-attention:integration}
      - {name: Verify active HSE Self-Confidence model against real PostgreSQL, run: npm run verify:hse-self-confidence:integration}
      - {name: Verify active HSE Stress model against real PostgreSQL, run: npm run verify:hse-stress:integration}
      - {name: Verify HBS Avoidance measurement model against real PostgreSQL, run: npm run verify:hbs-avoidance:integration}
      - {name: Verify HBS Consistency and Initiative measurement models against real PostgreSQL, run: npm run verify:hbs-consistency-initiative:integration}
      - {name: Verify HBS Reflection measurement model against real PostgreSQL, run: npm run verify:hbs-reflection:integration}
      - {name: Verify HRS Relationship Trust measurement model against real PostgreSQL, run: npm run verify:hrs-relationship-trust:integration}
      - {name: Verify HRS Communication and Repair measurement models against real PostgreSQL, run: npm run verify:hrs-communication-repair:integration}
      - {name: Verify HRS Emotional Safety measurement model against real PostgreSQL, run: npm run verify:hrs-emotional-safety:integration}
      - {name: Verify HGS Self-Awareness measurement model against real PostgreSQL, run: npm run verify:hgs-self-awareness:integration}
      - {name: Verify HGS Resilience measurement model against real PostgreSQL, run: npm run verify:hgs-resilience:integration}
      - {name: Verify HGS Purpose Alignment measurement model against real PostgreSQL, run: npm run verify:hgs-purpose-alignment:integration}
      - {name: Verify HGS Habit Strength measurement model against real PostgreSQL, run: npm run verify:hgs-habit-strength:integration}
      - {name: Verify HIM structured-current binding-transition safety against real PostgreSQL, run: npm run verify:him-structured-current-binding-transition-safety:integration}
      - {name: Verify HIM historical verifier forward compatibility against real PostgreSQL, run: npm run verify:him-historical-verifier-forward-compatibility:integration}
      - {name: Verify HIM historical ACTIVE-binding version forward compatibility against real PostgreSQL, run: npm run verify:him-historical-binding-version-forward-compatibility:integration}
      - {name: Verify HIM legacy snapshot authority retirement and Energy context reconciliation against real PostgreSQL, run: npm run verify:him-legacy-snapshot-authority-energy-context-reconciliation:integration}
      - {name: Verify HIM canonical latest measurement read semantics against real PostgreSQL, run: npm run verify:him-canonical-latest-measurement-read-semantics:integration}
      - {name: Verify HIM legacy Energy current authority reconciliation against real PostgreSQL, run: npm run verify:him-legacy-energy-current-authority-reconciliation:integration}
      - {name: Verify HIM contextual current-intelligence batch read against real PostgreSQL, run: npm run verify:him-contextual-current-intelligence-batch:integration}
      - {name: Verify HIM session context binding relevance against real PostgreSQL, run: npm run verify:him-session-context-binding:integration}
      - {name: Verify HIM Situation-bound stress foreground consumption against real PostgreSQL, run: npm run verify:him-situation-stress-foreground-consumption:integration}
      - {name: Verify HIM Decision-bound attention foreground consumption against real PostgreSQL, run: npm run verify:him-decision-attention-foreground-consumption:integration}
      - {name: Verify HIM cross-context foreground aggregation against real PostgreSQL, run: npm run verify:him-cross-context-foreground-aggregation:integration}
