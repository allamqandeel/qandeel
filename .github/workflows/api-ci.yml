name: API CI
on:
  pull_request:
    paths: ['apps/api/**','database/**','tests/**','package.json','package-lock.json','tsconfig.base.json','.github/workflows/api-ci.yml']
  push:
    branches: [main]
jobs:
  verify-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: qandeel_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d qandeel_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qandeel_test
      PGPASSWORD: postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - {name: Install dependencies, run: npm ci}
      - {name: Verify npm-only toolchain contract, run: npm run test:toolchain}
      - {name: Verify A2 E2E runtime smoke static contract, run: npm run test:a2-e2e-smoke-contract}
      - {name: Verify Full Intelligence E2E runtime static contract, run: npm run test:full-intelligence-e2e-runtime-contract}
      - {name: Verify cross-context foreground application transport static contract, run: npm run test:cross-context-foreground-application-transport-contract}
      - {name: Verify explicit session context activation entry static contract, run: npm run test:explicit-session-context-activation-entry-contract}
      - {name: Verify HIM Brain Context bridge application static contract, run: npm run test:him-brain-context-bridge-contract}
      - {name: Verify Human Intelligence provider semantics consolidation static contract, run: npm run test:human-intelligence-provider-semantics-consolidation-contract}
      - {name: Verify HSE Snapshot foreground latency-safe degradation static contract, run: npm run test:him-snapshot-foreground-latency-safe-degradation-contract}
      - {name: Verify Human Intelligence Activation phase closure contract, run: npm run test:human-intelligence-activation-phase-closure-contract}
      - {name: Verify Integrated Intelligence Runtime contract, run: npm run test:integrated-intelligence-runtime-contract}
      - {name: Verify FAST/DEEP Runtime Decision Policy v2 static contract, run: npm run test:fast-deep-runtime-decision-policy-v2-contract}
      - {name: Verify Bounded Foreground Intelligence Gatherer static contract, run: npm run test:bounded-foreground-intelligence-gatherer-v1-contract}
      - {name: Verify Integrated Context Budget & Conflict Resolution static contract, run: npm run test:integrated-context-budget-conflict-resolution-v1-contract}
      - {name: Verify Post-Response Intelligence Scheduler & Provider Budget static contract, run: npm run test:post-response-intelligence-scheduler-provider-budget-v1-contract}
      - {name: Verify Question / Information-Gap Closed Loop static contract, run: npm run test:question-information-gap-closed-loop-v1-contract}
      - {name: Verify Integrated Brain E2E Hardening v2 static contract, run: npm run test:integrated-brain-e2e-hardening-v2-contract}
      - {name: Verify Integrated Intelligence Runtime phase closure contract, run: npm run test:integrated-intelligence-runtime-phase-closure-contract}
      - {name: Verify Committed Conversational Unit activation boundary static contract, run: npm run test:committed-conversational-unit-activation-boundary-contract}
      - {name: Verify Session Semantic Clock / SP / LH delivery static contract, run: npm run test:session-semantic-clock-sp-lh-delivery-contract}
      - {name: Verify Reference / Attention focus evaluator static contract (T-03B1a), run: npm run test:reference-attention-focus-evaluator-contract}
      - {name: Verify durable reference / Emerging Focus SP substrate static contract (T-03B1b1), run: npm run test:durable-reference-emerging-focus-sp-substrate-contract}
      - {name: Verify focus runtime integration readiness static contract (T-03B1b2), run: npm run test:conversation-focus-runtime-integration-readiness-contract}
      - {name: Verify Thread establishment evaluator static contract (T-03B2a), run: npm run test:thread-establishment-evaluator-contract}
      - {name: Verify canonical Home placement engine static contract + golden / 10k append replay (T-03B2b1), run: npm run test:canonical-home-placement-engine-contract}
      - {name: Verify durable Thread / permanent Home same-SP substrate static contract (T-03B2b2), run: npm run test:durable-thread-home-same-sp-substrate-contract}
      - {name: Verify Thread runtime integration readiness static contract (T-03B2b3), run: npm run test:thread-runtime-integration-readiness-contract}
      - {name: Verify Thread lifecycle + cross-Session continuity static contract (T-03B3), run: npm run test:thread-lifecycle-cross-session-continuity-contract}
      - {name: Verify effective Live Focus + FINAL semantic-chain cutover static contract (T-03D), run: npm run test:effective-live-focus-final-semantic-chain-cutover-contract}
      - {name: Verify historical coverage + Layer A projection + Layer B disclosure static contract (T-03C), run: npm run test:historical-projection-contract}
      - {name: Verify Shared delivery authority revalidation boundary static contract (I-03F), run: npm run test:shared-delivery-authority-revalidation-contract}
      - {name: Verify Connected Worlds I-03 authority / consent / EffectiveContext phase closure contract (I-03G), run: npm run test:connected-worlds-i03-authority-closure-contract}
      - {name: Verify task closure governance contract (BG-08 reconciliation + BG-09 status synchronization), run: npm run test:task-closure-governance-contract}
      # Cross-cutting, and deliberately last of the static contracts: it mirrors the repository,
      # performs the authorized future changes that are known to be coming (a new mobile gate, a new
      # migration, T-10 motion, T-11 responsive work, T-12 shell integration, a new root
      # devDependency) and re-runs every contract above against the mutated tree — then proves the
      # mutations that must still be refused really are.
      - {name: Verify repository forward-safety gate (no static contract is a mutable-global ceiling), run: npm run test:forward-safety-contract}
      - {name: Verify harness temp-mirror cleanup (QANDEEL_TMP override + child cwd outside the mirror + bounded retry), run: npm run test:qan-inf-02-windows-temp-harness-cleanup-contract}
      - {name: Verify HIM generic application write authority retirement static contract, run: npm run test:him-generic-write-authority-retirement-contract}
      - {name: Verify HIM structured-measurement preflight, run: npm run verify:him-measurement-preflight}
      - {name: Verify Foundation integration / regression gate, run: npm run verify:foundation-integration-gate}
      # The ONE canonical bootstrap artifact, shared with the focused database gate.
      # It used to be duplicated here as inline SQL, which made parity a comparison of
      # two texts that could drift apart in either direction. A single file cannot:
      # whatever this gate bootstraps, the focused gate bootstraps identically.
      - name: Bootstrap fresh Supabase-compatible PostgreSQL roles
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/supabase-compatible-bootstrap.sql
      - name: Apply all migrations to fresh PostgreSQL
        run: for migration in database/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - name: Verify Supabase keep-alive database contract
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            keepalive_oid oid := 'public.qandeel_keepalive()'::regprocedure::oid;
          BEGIN
            IF NOT EXISTS (
              SELECT 1
              FROM pg_proc AS p
              JOIN pg_language AS language ON language.oid = p.prolang
              WHERE p.oid = keepalive_oid
                AND p.prorettype = 'boolean'::regtype
                AND p.pronargs = 0
                AND p.provolatile = 's'
                AND p.prosecdef = false
                AND p.proconfig = ARRAY['search_path=""']::text[]
                AND language.lanname = 'sql'
                AND trim(regexp_replace(p.prosrc, '\s+', ' ', 'g')) = 'SELECT true;'
            ) THEN
              RAISE EXCEPTION 'qandeel_keepalive function posture is invalid';
            END IF;

            IF EXISTS (
              SELECT 1
              FROM pg_proc AS p,
                LATERAL aclexplode(p.proacl) AS privilege
              WHERE p.oid = keepalive_oid
                AND privilege.grantee = 0
                AND privilege.privilege_type = 'EXECUTE'
            ) THEN
              RAISE EXCEPTION 'PUBLIC can execute qandeel_keepalive';
            END IF;

            IF NOT has_function_privilege('anon', keepalive_oid, 'EXECUTE')
              OR has_function_privilege('authenticated', keepalive_oid, 'EXECUTE')
              OR has_function_privilege('service_role', keepalive_oid, 'EXECUTE') THEN
              RAISE EXCEPTION 'qandeel_keepalive role grants are invalid';
            END IF;
          END
          $$;

          SET ROLE anon;
          SELECT 1 / CASE WHEN public.qandeel_keepalive() IS TRUE THEN 1 ELSE 0 END;
          RESET ROLE;
          SQL
