name: API CI
on:
  pull_request:
    paths: ['apps/api/**','database/**','tests/**','package.json','package-lock.json','tsconfig.base.json','.github/workflows/api-ci.yml']
  push:
    branches: [main]
jobs:
  verify-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env: {POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: qandeel_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U postgres -d qandeel_test"
          --health-interval=5s --health-timeout=5s --health-retries=12
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/qandeel_test
      PGPASSWORD: postgres
      REDIS_URL: redis://localhost:6379
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: {node-version: '20', cache: npm}
      - {name: Install dependencies, run: npm ci}
      - {name: Verify npm-only toolchain contract, run: npm run test:toolchain}
      - {name: Verify A2 E2E runtime smoke static contract, run: npm run test:a2-e2e-smoke-contract}
      - {name: Verify HIM structured-measurement preflight, run: npm run verify:him-measurement-preflight}
      - {name: Verify Foundation integration / regression gate, run: npm run verify:foundation-integration-gate}
      - name: Bootstrap fresh Supabase-compatible PostgreSQL roles
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TABLE auth.users (id uuid PRIMARY KEY);
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE AS $$
            SELECT (nullif(current_setting('request.jwt.claims', true), '')::jsonb->>'sub')::uuid
          $$;
          ALTER FUNCTION auth.uid() OWNER TO postgres;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated;
          GRANT EXECUTE ON FUNCTION auth.uid() TO anon, authenticated;
          SQL
      - name: Apply all migrations to fresh PostgreSQL
        run: for migration in database/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"; done
      - {name: Verify authenticated database foundation, run: npm run verify:database:integration}
      - {name: Verify conversation authority hardening, run: npm run verify:conversation-authority:integration}
      - {name: Verify conversation session authority hardening, run: npm run verify:conversation-session-authority:integration}
      - {name: Verify Memory runtime, run: npm run verify:memory:integration}
      - {name: Verify Memory authority hardening, run: npm run verify:memory-authority:integration}
      - {name: Verify Hypothesis runtime, run: npm run verify:hypothesis:integration}
      - {name: Verify Hypothesis authority hardening, run: npm run verify:hypothesis-authority:integration}
      - {name: Verify canonical Evidence eligibility, run: npm run verify:canonical-evidence:integration}
      - {name: Verify Confidence runtime, run: npm run verify:confidence:integration}
      - {name: Verify Question runtime, run: npm run verify:question:integration}
      - {name: Verify Hypothesis update runtime, run: npm run verify:hypothesis-update:integration}
      - {name: Verify HIM foundation runtime, run: npm run verify:him:integration}
      - {name: Verify Initial HIM against real PostgreSQL, run: npm run verify:initial-him:integration}
      - {name: Verify HIM calculation/calibration historical runtime, run: npm run verify:him-calculation:integration}
      - {name: Verify active HSE Energy model against real PostgreSQL, run: npm run verify:hse-energy:integration}
      - {name: Verify active HSE Motivation model against real PostgreSQL, run: npm run verify:hse-motivation:integration}
      - {name: Verify active HSE Attention model against real PostgreSQL, run: npm run verify:hse-attention:integration}
      - {name: Verify active HSE Self-Confidence model against real PostgreSQL, run: npm run verify:hse-self-confidence:integration}
      - {name: Verify active HSE Stress model against real PostgreSQL, run: npm run verify:hse-stress:integration}
      - {name: Verify HIM temporal trend source against real PostgreSQL, run: npm run verify:him-trends:integration}
      - {name: Verify HIM Intelligence Snapshot against real PostgreSQL, run: npm run verify:him-snapshot:integration}
      - {name: Verify Runtime Event Outbox against real PostgreSQL, run: npm run verify:runtime-events:integration}
      - {name: Verify background intelligence repository adapters, run: npm run verify:background-intelligence-adapters:integration}
      - {name: Verify post-response intelligence dispatch ledger, run: npm run verify:post-response-intelligence-db:integration}
      - {name: Verify association provider effect key, run: npm run verify:association-provider-effect-key:integration}
      - {name: Verify durable Memory effect results, run: npm run verify:durable-memory-effect-result:integration}
      - {name: Verify durable Intent provider results, run: npm run verify:durable-intent-result:integration}
      - {name: Verify durable Association provider results, run: npm run verify:durable-association-provider-result:integration}
      - {name: Verify server-authorized Hypothesis Update invocation, run: npm run verify:server-hypothesis-update:integration}
      - {name: Verify hypothesis generation atomicity and durable recovery, run: npm run verify:hypothesis-generation-atomicity:integration}
      - {name: Verify exact-version post-update Confidence, run: npm run verify:exact-version-confidence:integration}
      - {name: Verify automatic hypothesis update invocation, run: npm run verify:hypothesis-update-auto-invocation:integration}
      - {name: Verify Redis Streams dispatch runtime, run: npm run verify:post-response-dispatch:integration}
      - {name: Verify A2 end-to-end runtime smoke, run: npm run verify:a2-e2e-runtime-smoke}

