name: VPORT-02 visual proof
# VPORT-02 — the final VPORT-01 world with the VPORT-02 temporal / orientation / iconography layer on the production
# route, on an Android emulator. VALIDATION ONLY.
#
# Builds a Release APK whose ROOT COMPONENT is the VPORT-02 proof root (one recorded change of the mobile manifest's
# `main`, made by `apps/mobile/scripts/select-vport02-proof-entry.mjs` in this ephemeral checkout only). The proof root
# mounts the PRODUCTION `RuntimePhaseSurface` over the production `createIntegrationRuntime`, given the VPORT-01 proof
# world's in-memory identity and scripted network: no credential exists in this job and none is needed.
#
# scripts/vport02/run-vport02-visual-proof.sh drives the matrix (Arabic / English; standard, 320-class narrow,
# landscape; increased contrast; launched under Reduce Motion; 320 dp at 200 % text; Reduce Motion turned on
# mid-session) and uploads every screenshot, recording, hierarchy dump, frame statistic and log.
#
# Scoped to the VPORT-02 branch: it proves that branch's heads and is inert everywhere else.
on:
  push:
    branches: ['feat/vport-02-temporal-orientation-p2-coherence']
    paths:
      - 'apps/mobile/**'
      - 'scripts/vport02/**'
      - 'package-lock.json'
      - '.github/workflows/vport-02-visual-proof.yml'
  workflow_dispatch:
concurrency:
  group: vport-02-visual-proof-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  CI: 1
  MAESTRO_VERSION: 2.10.0
  MAESTRO_ZIP_SHA256: 29b675e10cc12080e445e9bfb2e2b4e4dfb9c0f2e30d5884120d258b5e1cd991
jobs:
  proof-android:
    name: VPORT-02 proof — Android API 36 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - {name: Checkout, uses: actions/checkout@v4}
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm}
      - name: Setup Temurin JDK 17
        uses: actions/setup-java@v6
        with: {distribution: temurin, java-version: '17'}
      - {name: Install dependencies from the root lockfile, run: npm ci}
      - name: Confirm the generated world and P2 geometry are current (the build must ship exactly the generated constants)
        run: |
          node apps/mobile/scripts/generate-world-visual.mjs --check
          node apps/mobile/scripts/generate-p2-production.mjs --check
      - name: Select the VPORT-02 proof entry (the one recorded difference from the Product build)
        env: {VPORT02_VISUAL_PROOF: '1'}
        run: |
          node apps/mobile/scripts/select-vport02-proof-entry.mjs --apply
          echo "### VPORT-02 proof build — main: \`$(node -p "require('./apps/mobile/package.json').main")\`, commit \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
      - {name: Generate the Android project (CNG), run: npm run prebuild:android --workspace @qandeel/mobile}
      - name: Build the Release APK (x86_64 for the emulator)
        working-directory: apps/mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Install Maestro cli-2.10.0 (pinned; SHA-256 verified before extraction)
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/maestro.zip" "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_ZIP_SHA256}  ${RUNNER_TEMP}/maestro.zip" | sha256sum --check --strict
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP/maestro-dist"
          mkdir -p "$HOME/.maestro"
          cp -R "$RUNNER_TEMP/maestro-dist/maestro/." "$HOME/.maestro/"
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Drive the proof on the Android emulator (API 36, x86_64, google_apis)
        env:
          APK: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: false
          emulator-boot-timeout: 900
          script: bash scripts/vport02/run-vport02-visual-proof.sh "$APK" "$RUNNER_TEMP/vport02-proof"
      - name: Upload the proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vport-02-visual-proof-${{ github.sha }}
          path: ${{ runner.temp }}/vport02-proof
          if-no-files-found: warn
          include-hidden-files: true
