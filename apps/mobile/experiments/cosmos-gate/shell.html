<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Qandeel Cosmos Gate</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* One committed look: a deep void, warm lantern light, gold instrument hairlines. Chrome is glass and stays small. */
  :root { color-scheme: dark; --void: #05060f; --ink: #E9EAF4; --quiet: #9A9DB4; --gold: #ECCC8A; --gold-dim: rgba(236,204,138,.38);
    --glass: rgba(11,13,26,.62); --hair: rgba(233,234,244,.16);
    --ui: "Inter", "Tajawal", system-ui, sans-serif; --display: "Inter", "Tajawal", system-ui, sans-serif; }
  :root[lang="ar"] { --ui: "Tajawal", "Inter", system-ui, sans-serif; --display: "Tajawal", "Inter", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); overflow: hidden; overscroll-behavior: none; font-family: var(--ui); }
  #stage { position: fixed; inset: 0; max-width: 560px; margin: 0 auto; overflow: hidden; }
  #sky { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; cursor: grab; }
  #sky:active { cursor: grabbing; }
  /* The lens: the edges fall away, so the eye rests where the light is. Static; the compositor owns it. */
  #lens { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse 78% 60% at 50% 47%, rgba(5,6,15,0) 40%, rgba(5,6,15,.4) 72%, rgba(5,6,15,.86) 100%),
      linear-gradient(90deg, rgba(5,6,15,.82) 0, rgba(5,6,15,0) 15%, rgba(5,6,15,0) 85%, rgba(5,6,15,.82) 100%),
      linear-gradient(180deg, rgba(5,6,15,.66) 0, rgba(5,6,15,0) 17%, rgba(5,6,15,0) 76%, rgba(5,6,15,.62) 100%); }
  button, select { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; }
  button:focus-visible, select:focus-visible { outline: 1.5px solid var(--gold); outline-offset: 3px; border-radius: 6px; }

  #top { position: absolute; inset: 0 0 auto 0; padding: 14px 16px 0; display: grid; gap: 4px; pointer-events: none; }
  #top > * { pointer-events: auto; }
  #tabs { display: flex; justify-content: center; gap: 4px; }
  #tabs button { position: relative; min-height: 44px; padding: 0 14px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--quiet); transition: color .25s; }
  :root[lang="ar"] #tabs button { font-size: 15px; letter-spacing: 0; }
  #tabs button[aria-selected="true"] { color: var(--gold); }
  #tabs button::after { content: ""; position: absolute; left: 50%; bottom: 7px; width: 5px; height: 5px; margin-left: -2.5px; transform: rotate(45deg) scale(0); background: var(--gold); transition: transform .25s; }
  #tabs button[aria-selected="true"]::after { transform: rotate(45deg) scale(1); }
  #row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 44px; }
  #back { min-height: 40px; padding: 0 14px; border-radius: 999px; background: var(--glass); border: 1px solid var(--hair); font-size: 13px; color: var(--ink); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #back:disabled { opacity: 0; pointer-events: none; }
  #fixture { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: rgba(154,157,180,.75); text-align: end; }
  :root[lang="ar"] #fixture { font-size: 11px; letter-spacing: 0; }

  /* The depth rail: a graduated hairline. The current depth is the lit point; shallower depths can be returned to. */
  #rail { position: absolute; inset-inline-end: 6px; top: 50%; transform: translateY(-50%); display: grid; }
  #rail::before { content: ""; position: absolute; inset-inline-end: 21.5px; top: 22px; bottom: 22px; width: 1px; background: linear-gradient(180deg, transparent, var(--gold-dim) 18%, var(--gold-dim) 82%, transparent); }
  .bead { position: relative; min-height: 44px; min-width: 44px; display: flex; align-items: center; justify-content: flex-end; gap: 10px; }
  .bead i { width: 5px; height: 5px; border-radius: 50%; background: var(--void); border: 1px solid var(--gold-dim); margin-inline-end: 19.5px; }
  .bead.past i { background: var(--gold-dim); }
  .bead.on i { width: 9px; height: 9px; margin-inline-end: 17.5px; background: var(--gold); border-color: var(--gold); box-shadow: 0 0 0 4px rgba(236,204,138,.14), 0 0 14px rgba(236,204,138,.7); }
  .bead span { font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--quiet); opacity: 0; transition: opacity .25s; text-shadow: 0 0 8px var(--void); }
  :root[lang="ar"] .bead span { font-size: 13px; letter-spacing: 0; }
  .bead.on span { opacity: 1; color: var(--gold); }
  .bead:disabled { cursor: default; }

  .absence { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%); max-width: 76%; text-align: center; font-family: var(--display); font-size: 16px; line-height: 1.5;
    background: var(--glass); border: 1px solid var(--hair); border-radius: 16px; padding: 14px 18px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .absence[hidden] { display: none; }
  .absence button { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 10px; color: var(--gold); font-family: var(--ui); font-size: 13px; }
  .arrow { display: inline-block; font-style: normal; }
  .pulse { display: inline-block; width: 7px; height: 7px; margin-inline-end: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); animation: pulse 1.3s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .25; } }

  /* The card overlays the world at a fixed height; it never resizes or pushes it. */
  #card { position: absolute; inset: auto 10px 10px 10px; height: 150px; background: var(--glass); border: 1px solid var(--hair); border-radius: 20px; padding: 14px 18px;
    backdrop-filter: blur(18px) saturate(1.2); -webkit-backdrop-filter: blur(18px) saturate(1.2);
    transform: translateY(calc(100% + 16px)); transition: transform .34s cubic-bezier(.2,.8,.2,1); overflow: hidden; }
  #card::before { content: ""; position: absolute; inset: 0 22px auto 22px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: .7; }
  #card.open { transform: none; }
  #card header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  #card header b { font-family: var(--display); font-size: 19px; line-height: 1.3; font-weight: 700; color: #FFF1D6; }
  #card header button { min-width: 44px; min-height: 44px; margin: -12px -14px 0 0; font-size: 20px; color: var(--quiet); }
  [dir="rtl"] #card header button { margin: -12px 0 0 -14px; }
  #card p { margin: 5px 0 0; font-size: 14px; line-height: 1.55; color: var(--ink); }
  #card .meta, #card .quiet { color: var(--quiet); font-size: 11.5px; letter-spacing: .04em; }
  #card .body { max-height: 88px; overflow: auto; }
  #card .body button { min-height: 44px; color: var(--gold); }
  .sk { height: 10px; border-radius: 6px; margin-top: 11px; background: var(--hair); animation: pulse 1.3s ease-in-out infinite; }
  .sk.s { width: 58%; }

  /* Personal: the positions of the session. Lit up to the viewed position; nothing after it is known. */
  #selvedge { position: absolute; inset: auto 18px 16px 18px; display: flex; align-items: center; flex-wrap: wrap; gap: 2px 14px; font-size: 11px; letter-spacing: .08em; color: var(--quiet); }
  #selvedge[hidden] { display: none; }
  #card.open ~ #selvedge { display: none; }
  .ticks { display: flex; flex: 1 1 100%; }
  .ticks button { flex: 1; height: 44px; position: relative; }
  .ticks button::after { content: ""; position: absolute; left: 50%; top: 50%; width: 1px; height: 9px; margin-top: -4.5px; background: var(--hair); }
  .ticks button.woven::after { background: var(--gold-dim); height: 13px; margin-top: -6.5px; }
  .ticks button.at::after { width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); }
  #selvedge > button { min-height: 44px; padding: 0 10px; color: var(--gold); margin-inline-start: auto; }
  .fringe::before { content: "◌ "; }
  #hint { display: none; }

  #labtoggle { position: fixed; inset: 8px auto auto 8px; z-index: 4; min-width: 44px; min-height: 44px; font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase; color: rgba(154,157,180,.6); }
  #lab { position: fixed; inset: 50px auto auto 10px; z-index: 4; display: none; gap: 6px; flex-direction: column; align-items: flex-start; font-size: 11px; }
  body.lab #lab { display: flex; }
  #lab > button, #lab > select { min-height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--hair); background: rgba(11,13,26,.9); }
  #lab button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  #hud { font: 10.5px/1.5 ui-monospace, Menlo, monospace; color: var(--ink); background: rgba(11,13,26,.9); border: 1px solid var(--hair); padding: 6px 8px; border-radius: 8px; max-width: 250px; }
  @media (max-width: 760px) { #top { padding-top: calc(40px + env(safe-area-inset-top, 0px)); } }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (prefers-reduced-motion: reduce) { #card { transition: none; } .pulse, .sk { animation: none; } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="sky" role="img" aria-label="Living Analysis world"></canvas>
  <div id="lens"></div>
  <div id="top">
    <div id="tabs" role="tablist"></div>
    <div id="row"><button id="back"></button><span id="fixture"></span></div>
  </div>
  <nav id="rail" aria-label="Depth"></nav>
  <div id="absence" class="absence" role="status" aria-live="polite" hidden></div>
  <section id="card" aria-live="polite"></section>
  <div id="selvedge" hidden></div>
  <div id="hint"></div>
  <ul id="sr" class="vh" aria-label="Entities at this depth"></ul>
</div>
<button id="labtoggle" aria-controls="lab">Lab</button>
<div id="lab">
  <div id="hud" aria-hidden="true">move the world to measure</div>
  <button id="lang">AR / EN</button>
  <button id="names" aria-pressed="false">Future concept (not authorised): Personal names</button>
  <button id="dense" aria-pressed="false">Public ×400 stress</button>
  <select id="fault" aria-label="Simulated authority condition">
    <option value="NONE">Authority: normal</option>
    <option value="SLOW">Slow details (2 s)</option>
    <option value="FAIL">Reads fail</option>
    <option value="REFUSED">Refused</option>
    <option value="EMPTY_WORLD">World empty</option>
  </select>
</div>
<script>/*BUNDLE*/</script>
</body>
</html>
