# T-12 boot smoke only: the Release build launches and the integrated Product root mounts.
#
# It asserts ONE stable integration identifier and nothing else. The root renders in every runtime
# phase, so this proves exactly what a boot smoke can prove — the app launches and the Product root
# is on screen — and deliberately proves nothing about Product semantics: this build carries no
# configuration and no credentials, so there is no Session, no viewpoint and no world to assert on.
# Those belong to focused tests, not here.
#
# The T-01 technical shell is no longer asserted, and it is no longer rendered: the Product root
# replaced it rather than hiding it behind it.
appId: com.qandeel.mobile
---
- launchApp:
    clearState: true
- assertVisible:
    id: "qandeel-product-root"
