# T-12 boot smoke only: the Release build launches and the integrated Product root mounts.
#
# It asserts ONE visible technical header rendered by the integrated Product root and nothing else.
# This is more reliable on iOS than asserting a container testID through XCTest's accessibility tree,
# while proving the same boot fact for this deliberately unconfigured Release build: React mounted,
# ProductRoot rendered, and the technical pre-Product surface is on screen. It claims no Session,
# viewpoint, world, or Product semantics.
# Those belong to focused tests, not here.
#
# The T-01 technical shell is no longer asserted, and it is no longer rendered: the Product root
# replaced it rather than hiding it behind it.
#
# QAN-INF-04: this flow is also the validation script of the artifact reuse demonstration, which
# installs a separately-built binary and launches it. Flow files live under apps/mobile/.maestro/,
# which the build-input fingerprint excludes: Maestro interprets them on the runner and drives the
# app from outside it, so changing one cannot change a binary and must not invalidate one.
appId: com.qandeel.mobile
---
- launchApp:
    clearState: true
- assertVisible:
    text: "QANDEEL"
