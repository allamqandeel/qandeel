# S4-01 Journey C — My World ↔ Shared World on the production route. VALIDATION ONLY (S401ProofRoot.tsx).
# The Personal world is kept and restored; Shared entry shows only the neutral pre-authority shell until ALLOW; re-entry
# restores the Shared World after authority is resolved again; a revoked authority fails safe with nothing of the World.
# Driven by scripts/phase-m/run-s401-proof-leg.sh, which passes PREFIX.
appId: com.qandeel.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "qandeel-conversation-thread"
    timeout: 120000
- openLink: "qandeel://s401-proof/world/seed"
- waitForAnimationToEnd:
    timeout: 6000
- takeScreenshot: ${PREFIX}-01-my-world
- tapOn:
    id: "qandeel-switcher-shared_world"
- extendedWaitUntil:
    visible:
      id: "qandeel-shared-root"
    timeout: 30000
# The Personal world stays MOUNTED beneath the Shared area by design (DepthComposition: pointerEvents none, hidden from
# assistive technology), so its nodes may still be in the platform hierarchy; what is proved is what the reader meets:
# the Shared destination is the selected one, the Shared surface is the one on screen, and a press aimed at the Personal
# world's depth door lands on the Shared area and changes nothing. Its accessibility hiding is proved by the production
# integration test (s4-01-shared-world.test.tsx: accessibilityElementsHidden, pointerEvents none).
- assertVisible:
    id: "qandeel-switcher-shared_world"
    selected: true
- assertVisible:
    id: "qandeel-switcher-my_world"
    selected: false
- assertVisible:
    id: "qandeel-shared-title"
- tapOn:
    id: "qandeel-depth-to-analysis"
    optional: true
- assertNotVisible:
    id: "qandeel-map-surface"
- assertVisible:
    id: "qandeel-shared-root"
- takeScreenshot: ${PREFIX}-02-shared-root
- tapOn:
    id: "qandeel-shared-world-54010001-0000-4000-8000-000000000000"
# Before ALLOW: the neutral shell only — no welcome, no member, no title. The proof world HOLDS this entry before its
# ALLOW answer until world/allow releases it (s401-proof-world.ts), so the shell is asserted deterministically, never
# against a timed authority delay.
- assertVisible:
    id: "qandeel-shared-transition"
- assertNotVisible:
    id: "qandeel-shared-welcome"
- assertNotVisible:
    id: "qandeel-shared-members"
- takeScreenshot: ${PREFIX}-03-pre-authority-shell
- openLink: "qandeel://s401-proof/world/allow"
- extendedWaitUntil:
    visible:
      id: "qandeel-shared-welcome"
    timeout: 30000
- assertVisible:
    id: "qandeel-shared-members"
- takeScreenshot: ${PREFIX}-04-world-after-allow
# Back to My World: the same Conversation, reachable again.
- tapOn:
    id: "qandeel-switcher-my_world"
- extendedWaitUntil:
    visible:
      id: "qandeel-conversation-thread"
    timeout: 30000
- assertNotVisible:
    id: "qandeel-shared-area"
- assertVisible:
    id: "qandeel-switcher-my_world"
    selected: true
# The same Personal state, still interactive: its depth door opens the same Analysis and returns.
- tapOn:
    id: "qandeel-depth-to-analysis"
- extendedWaitUntil:
    visible:
      id: "qandeel-map-surface"
    timeout: 60000
- tapOn:
    id: "qandeel-depth-to-conversation"
- extendedWaitUntil:
    visible:
      id: "qandeel-conversation-thread"
    timeout: 30000
- takeScreenshot: ${PREFIX}-05-my-world-restored
# Re-entry: the Shared World the reader left, after authority is resolved again.
- tapOn:
    id: "qandeel-switcher-shared_world"
- assertVisible:
    id: "qandeel-shared-transition"
- assertNotVisible:
    id: "qandeel-shared-members"
- openLink: "qandeel://s401-proof/world/allow"
- extendedWaitUntil:
    visible:
      id: "qandeel-shared-welcome"
    timeout: 30000
- takeScreenshot: ${PREFIX}-06-shared-world-restored
# Revoked: the next entry fails safe — one neutral answer, nothing of the World.
- openLink: "qandeel://s401-proof/world/revoke"
- tapOn:
    id: "qandeel-switcher-my_world"
- extendedWaitUntil:
    visible:
      id: "qandeel-conversation-thread"
    timeout: 30000
- tapOn:
    id: "qandeel-switcher-shared_world"
- extendedWaitUntil:
    visible:
      id: "qandeel-shared-world-unavailable"
    timeout: 30000
- assertNotVisible:
    id: "qandeel-shared-welcome"
- assertNotVisible:
    id: "qandeel-shared-members"
- takeScreenshot: ${PREFIX}-07-revoked-fails-safe
