# S8B-03 CP2 — iOS Simulator: ONE step of the Voice Note native-capability proof. VALIDATION ONLY.
# Sends the proof root one launch link (qandeel://s803-proof/<CMD>), waits for its one-line result on screen (EXPECT, a
# regular expression over the s803-log text) and keeps a screenshot. Driven by scripts/s8b-03/run-s803-ios-proof.sh,
# which passes PREFIX, CMD and EXPECT. The proof root is never the product entry (select-s803-proof-entry.mjs).
appId: com.qandeel.mobile
---
- openLink: "qandeel://s803-proof/${CMD}"
# iOS asks before a link from outside the app opens it («Open in "QANDEEL"?»); the flow confirms, as a reader would.
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      text: ${EXPECT}
    timeout: 30000
- takeScreenshot: ${PREFIX}-${CMD}
