# T-13 recovery validation — AFTER adopting a Session the server does not attribute to this identity.
#
# The pass condition is RECOVERY_FAILED with SESSION_INVALID: the stored locator was validated against
# server authority and refused, no replacement Session was minted, and no world was shown. A READY here
# would mean a foreign Session became this identity's, which is the failure this phase exists to detect.
appId: com.qandeel.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "qandeel-t1204-validation-harness"
    timeout: 90000

- tapOn:
    id: "t13-run-RECOVERY_AFTER_REFUSED"
- extendedWaitUntil:
    visible:
      id: "t1204-report"
    timeout: 120000

- takeScreenshot: t13-after-refused

- assertVisible:
    id: "t1204-step-T13-F.1"
- assertVisible:
    text: "(?s).*phase=RECOVERY_FAILED failure=SESSION_INVALID.*"
- assertVisible:
    text: "RECOVERY_AFTER_REFUSED — allPassed=true"
