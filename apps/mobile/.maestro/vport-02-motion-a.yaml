# VPORT-02 — QAN-BL-A11Y-01 on a device, part A: launched with standard motion, into the Analysis, one camera travel
# recorded at full motion. The app is NOT stopped after this flow: the driver then turns Reduce Motion ON while the app
# keeps running, and part B records the same travel without any relaunch. VALIDATION ONLY.
appId: com.qandeel.mobile
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "qandeel-conversation-thread"
    timeout: 120000
- tapOn:
    id: "qandeel-depth-to-analysis"
- extendedWaitUntil:
    visible:
      id: "qandeel-map-surface"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 6000
- startRecording: ${PREFIX}-before
- openLink: "qandeel://vport02-proof/zoom-in"
- waitForAnimationToEnd:
    timeout: 4000
- openLink: "qandeel://vport02-proof/zoom-out"
- waitForAnimationToEnd:
    timeout: 4000
- stopRecording
- takeScreenshot: ${PREFIX}-before-settled
