# W2-01 proof — the final Sign in with the keyboard open, left open for measurement. VALIDATION ONLY.
#
# The primary act is first proved reachable by scrolling to it (the drag closes the keyboard, as the
# entry frame dismisses it on drag); then the password is focused again so the keyboard is genuinely open
# for scripts/w2/run-w2-01-proof.sh to measure. PREFIX / LOGIN_ID come from that script.
appId: com.qandeel.mobile
---
- runFlow:
    file: w2-01-choose.yaml
    env:
      SCENARIO_ID: "w2-proof-scenario-signed-out"
- extendedWaitUntil:
    visible:
      id: "qandeel-sign-in-email"
    timeout: 60000
- runFlow:
    file: w1b-01-type.yaml
    env:
      FIELD: "qandeel-sign-in-email"
      TEXT: ${LOGIN_ID}
- tapOn:
    id: "qandeel-sign-in-password"
- waitForAnimationToEnd:
    timeout: 5000
- inputRandomText:
    length: 14
- scrollUntilVisible:
    element:
      id: "qandeel-sign-in-submit"
    direction: DOWN
    timeout: 20000
    centerElement: false
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${PREFIX}-10-sign-in-submit-reachable
- tapOn:
    id: "qandeel-sign-in-password"
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${PREFIX}-11-sign-in-keyboard-measured
