# T-12 Phase M / QAN-BL-T12-04 — phase 3, sign-out and identity replacement.
#
# Runs against the SAME launch as phase 2, with no clear and no reinstall. Identity B is supplied here
# and nowhere else; its email is erased from the field before the screenshot exists.
#
# `T12-04.5` is the claim that matters most and the only one that is a credential-exposure question
# rather than a convenience one: after A signs out and B signs in, B must receive its own QANDEEL
# Session and must not adopt A's. That is decided by the real API's authorization boundary, never by
# the client, so this flow proves nothing at all if the API is unreachable — the report says so, with
# `phase=` rather than a Session shape.
appId: com.qandeel.mobile
# NO env: block, and that absence is the correction.
#
# It used to declare EMAIL_B and PASSWORD_B as empty defaults. They are gone because an empty
# declared default is a trap: it turns a missing value into a silent one instead of an error.
#
# It is NOT, however, what broke the sign-in, and the earlier note here saying so was wrong. The
# harness reports identityEmailChars=22 and identityPasswordChars=9, so the supplied values do
# reach the fields. The flow had been failing on its own assertion instead, before the sign-in was
# ever attempted.
---
- launchApp
# A cold Release launch on a loaded runner can take longer than the default assertion window, and
# the captured hierarchy proved it: the harness WAS on screen with every control present when the
# debug snapshot was taken moments after the assertion had already given up. An impatient wait
# reported the app as broken when it was only slow, so the wait is now explicit.
- extendedWaitUntil:
    visible:
      id: "qandeel-t1204-validation-harness"
    timeout: 90000

# The same keyboard-presentation settle phase 1 carries, and for the same measured reason: text sent
# while the software keyboard is still animating in arrives nowhere, and the run then reports a zero
# character count for a credential that was supplied correctly.
- tapOn:
    id: "t1204-second-email"
- waitForAnimationToEnd:
    timeout: 5000
- inputText: ${EMAIL_B}
- tapOn:
    id: "t1204-second-password"
- waitForAnimationToEnd:
    timeout: 5000
- inputText: ${PASSWORD_B}
- hideKeyboard

- tapOn:
    id: "t1204-run-SIGN_OUT_AND_REPLACEMENT"
- extendedWaitUntil:
    visible:
      id: "t1204-report"
    timeout: 90000

- tapOn:
    id: "t1204-second-email"
- eraseText: 64
- hideKeyboard

- takeScreenshot: t1204-phase-3-signout-replacement

- assertVisible:
    id: "t1204-step-T12-04.4"
- assertVisible:
    id: "t1204-step-T12-04.5"
- assertVisible:
    text: "AFTER_RESTART — allPassed=true"
