# W2-01 proof — the new-password step with the keyboard open, left open for measurement. VALIDATION ONLY.
#
# Walks Sign in → recovery request → code → new password, proves "Change password" reachable by scrolling
# to it, then focuses the confirmation field so the keyboard is genuinely open for
# scripts/w2/run-w2-01-proof.sh to measure. PREFIX / EMAIL / NEW_PASSWORD come from that script.
appId: com.qandeel.mobile
---
- runFlow:
    file: w2-01-choose.yaml
    env:
      SCENARIO_ID: "w2-proof-scenario-signed-out"
- extendedWaitUntil:
    visible:
      id: "qandeel-sign-in-email"
    timeout: 60000
- scrollUntilVisible:
    element:
      id: "qandeel-sign-in-forgot-password"
    direction: DOWN
    timeout: 20000
    centerElement: false
- tapOn:
    id: "qandeel-sign-in-forgot-password"
- extendedWaitUntil:
    visible:
      id: "qandeel-recovery-email"
    timeout: 20000
- runFlow:
    file: w1b-01-type.yaml
    env:
      FIELD: "qandeel-recovery-email"
      TEXT: ${EMAIL}
- tapOn:
    id: "qandeel-recovery-title"
- tapOn:
    id: "qandeel-recovery-send"
- extendedWaitUntil:
    visible:
      id: "qandeel-recovery-code-field"
    timeout: 30000
- tapOn:
    id: "qandeel-recovery-code-field"
- waitForAnimationToEnd:
    timeout: 5000
- inputRandomNumber:
    length: 6
- tapOn:
    id: "qandeel-recovery-code-title"
- tapOn:
    id: "qandeel-recovery-code-submit"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "qandeel-recovery-code-field"
    commands:
      - tapOn:
          id: "qandeel-recovery-code-field"
      - eraseText: 12
      - inputRandomNumber:
          length: 6
      - tapOn:
          id: "qandeel-recovery-code-title"
      - tapOn:
          id: "qandeel-recovery-code-submit"
- extendedWaitUntil:
    visible:
      id: "qandeel-recovery-new-password-field"
    timeout: 30000
- tapOn:
    id: "qandeel-recovery-new-password-field"
- waitForAnimationToEnd:
    timeout: 5000
- inputText: ${NEW_PASSWORD}
- scrollUntilVisible:
    element:
      id: "qandeel-recovery-change-submit"
    direction: DOWN
    timeout: 20000
    centerElement: false
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${PREFIX}-12-new-password-submit-reachable
- tapOn:
    id: "qandeel-recovery-confirm-password-field"
- waitForAnimationToEnd:
    timeout: 5000
- inputText: ${NEW_PASSWORD}
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: ${PREFIX}-13-new-password-keyboard-measured
