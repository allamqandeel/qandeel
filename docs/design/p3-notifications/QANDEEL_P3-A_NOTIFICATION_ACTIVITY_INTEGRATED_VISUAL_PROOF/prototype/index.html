*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0a0a0a}
body{font-family:Estedad;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
#phone,#phone *{letter-spacing:0}
#phone[data-appearance="dark"]{--world:#101010;--world-rgb:16,16,16;--surface:#181818;--primary:#d8d5ca;--secondary:#afaca3;--tertiary:#8b8982;--brass:#a58e6f;--rest:#8b8982;--sel-ink:#d8d5ca;--marker:#d8d5ca;--focus:#d8d5ca;--focus-c:#101010;--press:rgba(216,213,202,0.1);--scrim:rgba(0,0,0,0.5);--error:#fe907e;--disabled:#696762;--w-rest:500;--w-sel:600;--focus-w:2px;--focus-cw:1px;--focus-off:2px;--marker-h:2px;}
#phone[data-appearance="light"]{--world:#efeeeb;--world-rgb:239,238,235;--surface:#e7e6e3;--primary:#29271f;--secondary:#47443c;--tertiary:#626059;--brass:#7a6446;--rest:#626059;--sel-ink:#29271f;--marker:#29271f;--focus:#29271f;--focus-c:#efeeeb;--press:rgba(41,39,31,0.1);--scrim:rgba(0,0,0,0.532);--error:#ad4739;--disabled:#83817c;--w-rest:500;--w-sel:600;--focus-w:2px;--focus-cw:1px;--focus-off:2px;--marker-h:2px;}
#phone[data-appearance="dark"][data-contrast="more"]{--world:#101010;--world-rgb:16,16,16;--surface:#181818;--primary:#d8d5ca;--secondary:#afaca3;--tertiary:#8b8982;--brass:#a58e6f;--rest:#afaca3;--sel-ink:#d8d5ca;--marker:#d8d5ca;--focus:#d8d5ca;--focus-c:#101010;--press:rgba(216,213,202,0.1);--scrim:rgba(0,0,0,0.5);--error:#fe907e;--disabled:#696762;--w-rest:500;--w-sel:600;--focus-w:3px;--focus-cw:1px;--focus-off:2px;--marker-h:2px;}
#phone[data-appearance="light"][data-contrast="more"]{--world:#efeeeb;--world-rgb:239,238,235;--surface:#e7e6e3;--primary:#29271f;--secondary:#47443c;--tertiary:#626059;--brass:#7a6446;--rest:#626059;--sel-ink:#29271f;--marker:#29271f;--focus:#29271f;--focus-c:#efeeeb;--press:rgba(41,39,31,0.1);--scrim:rgba(0,0,0,0.532);--error:#ad4739;--disabled:#83817c;--w-rest:500;--w-sel:600;--focus-w:2px;--focus-cw:1px;--focus-off:2px;--marker-h:2px;}
#phone{--W:390px;--H:844px;--top:47px;--hdr:48px;--rail:56px;--home:34px;--comp:64px;--mark-d:6px;--ground:var(--world);
  position:relative;width:var(--W);height:var(--H);overflow:hidden;background:var(--world);color:var(--primary);isolation:isolate}
#phone[data-contrast="more"]{--mark-d:7px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#phone [hidden]{display:none !important}
.r-title{font-size:26px;line-height:1.6538;font-weight:600}
.r-head{font-size:20px;line-height:1.6;font-weight:600}
.r-body{font-size:17px;line-height:1.7647;font-weight:400}
.r-support{font-size:15px;line-height:1.6667;font-weight:400}
.r-action{font-size:14px;line-height:1.6429;font-weight:500}
.r-meta{font-size:12px;line-height:1.6667;font-weight:500}
.num{font-variant-numeric:tabular-nums}
bdi{unicode-bidi:isolate}
.fprobe{position:fixed;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);top:0;left:0}
#phone[dir="rtl"] .mirror{transform:scaleX(-1)}
button:focus{outline:0}
/* E1R FOCUS: the detached perimeter with its world-colour companion (as G3.2 / P2-A draw it). */
button:focus-visible,[tabindex]:focus-visible{outline:0;box-shadow:0 0 0 var(--focus-off) var(--focus-c),0 0 0 calc(var(--focus-off) + var(--focus-w)) var(--focus),0 0 0 calc(var(--focus-off) + var(--focus-w) + var(--focus-cw)) var(--focus-c)}
/* Headings take programmatic focus for assistive technology after a place change; they are not controls, so no ring. */
h1:focus-visible,h2:focus-visible{box-shadow:none !important}
/* E1R PRESSED: the ground takes the wash, UNDER the content (P2-A F-P2-06). */
.pz{position:relative;isolation:isolate}
.pz.down::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--press);z-index:-1}

/* ------------------------------------------------------------------ system chrome (not Product) */
.status{position:absolute;top:0;inset-inline:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:4px 28px 0;color:var(--primary);z-index:30;pointer-events:none}
.status .clock{font:600 16px/1 Estedad;direction:ltr}
.status .sys{display:flex;gap:6px;align-items:center;direction:ltr}
.homebar{position:absolute;bottom:8px;left:50%;width:134px;height:5px;border-radius:3px;background:var(--primary);transform:translateX(-50%);z-index:30;pointer-events:none}

/* ------------------------------------------------------------- the upper chrome (G1.1; P3-S) */
.hdr{position:absolute;top:var(--top);inset-inline:0;height:var(--hdr);display:flex;align-items:center;padding:0 10px;gap:2px;z-index:12}
.hbtn{position:relative;display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;color:var(--rest)}
.hbtn .lb{font-size:14px;line-height:1.6429;font-weight:var(--w-rest)}
.ibtn{position:relative;flex:none;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--rest)}
.push-end{margin-inline-start:auto}
/* THE ACTIVITY ENTRY — the global upper chrome's START edge, on every non-Analysis world surface. Neutral rest ink, in
   every state: it is not the navigation family, so it is never Living Brass (C3 §2A/§2C; task §7). */
#act-entry{color:var(--rest)}
/* THE ATTENTION MARK — presence, not a number: a neutral solid dot at the glyph's upper END corner, knocked out of
   the ground it sits on so it reads as attached, not as a second control. Never Brass, never error ink, never a count. */
.amark{position:absolute;top:calc(11px - var(--mark-d) / 2 + 1px);inset-inline-end:calc(11px - var(--mark-d) / 2 + 1px);width:var(--mark-d);height:var(--mark-d);border-radius:50%;
  background:var(--primary);box-shadow:0 0 0 2px var(--ground);pointer-events:none}
.amark.ring{background:transparent;box-shadow:inset 0 0 0 1.5px var(--primary),0 0 0 2px var(--ground)}

/* --------------------------------------------------------------------------- the navigation (G1.1 / P2) */
#rail{position:absolute;bottom:0;height:calc(var(--rail) + var(--home));inset-inline:0;background:var(--surface);z-index:20}
#rail .items{position:absolute;top:0;inset-inline:0;height:var(--rail);display:flex}
#rail .it{position:relative;flex:1;min-width:0;height:var(--rail);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 6px}
#rail .ic{display:block;height:24px;color:var(--brass);line-height:0}
#rail .lb{font-size:14px;line-height:1.6429;font-weight:var(--w-rest);color:var(--brass);white-space:nowrap}
#rail .it.sel .lb{font-weight:var(--w-sel)}
#rail .it.sel::after{content:"";position:absolute;top:0;inset-inline:22%;height:var(--marker-h);background:var(--marker)}

/* ---------------------------------------------------------------------- Conversation host (G1.1 / G1.2) */
.conv{position:absolute;top:calc(var(--top) + var(--hdr));bottom:calc(var(--home) + var(--rail) + var(--comp));inset-inline:0;overflow:hidden}
.thread{position:absolute;inset-inline:0;bottom:0;display:flex;flex-direction:column;padding:10px 24px 24px}
.day{color:var(--tertiary);margin:14px 0 2px;text-align:center}
.t{position:relative;margin-top:16px;color:var(--primary)}
.t.q{align-self:flex-end;max-width:calc(100% - 48px)}
.t.me{align-self:flex-start;margin-top:22px;margin-inline-start:-24px;max-width:calc(100% - 40px);background:var(--surface);padding-block:11px 12px;padding-inline:24px 18px;border-start-end-radius:18px;border-end-end-radius:18px}
.t .who{display:block;color:var(--secondary)}
.t.new{animation:none}
.composer{position:absolute;bottom:calc(var(--home) + var(--rail));height:var(--comp);inset-inline:0;background:var(--surface);z-index:6}
.composer .write{position:absolute;top:10px;inset-inline-start:20px;inset-inline-end:118px;height:44px}
.composer .ph{position:absolute;inset-inline:0;top:2px;color:var(--tertiary)}
.composer .line{position:absolute;inset-inline:0;top:37px;height:1px;background:var(--tertiary)}
.cbtn{position:absolute;top:10px;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--rest)}
.slot-o{inset-inline-end:14px}.slot-i{inset-inline-end:66px}
/* Live Call — Call Rail A with End Call at 27 px, exactly as P2 froze it (machines.mjs); nothing here changes it. */
.composer.call .write{inset-inline-end:184px}
.crail{position:absolute;inset:0;pointer-events:none;color:var(--tertiary)}
.cr-art{position:absolute;overflow:visible}
#phone[dir="rtl"] .cr-art{transform:scaleX(-1)}
.composer.call #end-call{inset-inline-end:12px;color:var(--primary)}
.composer.call #mute{inset-inline-end:78px}
.composer.call #route{inset-inline-end:122px}
.composer.call .elapsed{position:absolute;top:10px;inset-inline-start:0;color:var(--tertiary);unicode-bidi:isolate}
.world-name{position:absolute;top:calc(var(--top) + var(--hdr));inset-inline:0;padding:0 24px;color:var(--primary)}
.world-name .ph{color:var(--tertiary)}

/* ------------------------------------------------------------------------- THE ATTENTION STRIP (ASIDE) */
/* Anchored to the upper chrome, emerging from it; the one Surface tone; no scrim (an ASIDE: the world stays live).
   Short, readable, dismissible, Direct-Entry capable. No countdown, no pulse, no bounce. */
.strip{position:absolute;top:calc(var(--top) + var(--hdr) - 2px);inset-inline:10px;z-index:14;display:flex;align-items:stretch;background:var(--surface);border-radius:14px;min-height:60px;--ground:var(--surface)}
.strip .go{flex:1;min-width:0;display:flex;align-items:flex-start;gap:12px;padding:10px 4px 10px 14px;border-radius:14px;text-align:start;color:var(--primary)}
#phone[dir="rtl"] .strip .go{padding:10px 14px 10px 4px}
.strip .src{flex:none;color:var(--secondary);margin-top:3px;line-height:0}
.strip .tx{display:block;min-width:0}
.strip .meta{display:block;color:var(--secondary)}
.strip .say{display:block;color:var(--primary);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.strip .x{flex:none;align-self:center;width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--rest);margin-inline-end:4px}
/* THE CALL-SAFE STRIP (refinement §8): the same ASIDE, without Direct Entry — its body is text, its one act is dismiss. */
.strip .vis{display:contents}
.strip.callsafe .go{cursor:default}
/* In the Analysis (G3's own page, in a frame under P3) only the CALL-SAFE strip may appear, and only during an active Live
   Call: in the upper chrome row beside «المحادثة», temporarily and intentionally occluding the Replay slot (the one bounded
   exception). Its box is MEASURED from G3's elements (app.js chromeSlot); it never reaches the world (y ≥ 95). */
#g32host{position:absolute;inset:0;z-index:1}
#g32host iframe{display:block;width:100%;height:100%;border:0}
.strip.inchrome{min-height:0;border-radius:12px;align-items:center}
.strip.inchrome .go{align-items:center;gap:8px;padding:0 2px 0 10px;border-radius:12px}
#phone[dir="rtl"] .strip.inchrome .go{padding:0 10px 0 2px}
.strip.inchrome .src{margin-top:0}
.strip.inchrome .say{color:var(--primary)}
.strip.inchrome .x{margin-inline-end:0}

/* ---------------------------------------------------------------------------------- pushed pages */
.page{position:absolute;inset:0;background:var(--world);z-index:16;--ground:var(--world)}
.page .hdr h1{color:var(--primary);padding-inline:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page .body{position:absolute;top:calc(var(--top) + var(--hdr));bottom:0;inset-inline:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;padding-bottom:calc(var(--home) + 16px)}
.page .body::-webkit-scrollbar{display:none}

/* ------------------------------------------------------------------------------------- ACTIVITY */
.filters{position:sticky;top:0;z-index:6;background:var(--world);display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:0 10px 2px;
  -webkit-mask-image:linear-gradient(to var(--end-dir),#000 calc(100% - 24px),transparent);mask-image:linear-gradient(to var(--end-dir),#000 calc(100% - 24px),transparent)}
#phone[dir="rtl"]{--end-dir:left}#phone[dir="ltr"]{--end-dir:right}
.filters::-webkit-scrollbar{display:none}
.fchip{position:relative;flex:none;min-height:44px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;color:var(--rest);white-space:nowrap}
.fchip .lb{font-size:14px;line-height:1.6429;font-weight:var(--w-rest)}
.fchip[aria-pressed="true"]{color:var(--sel-ink)}
.fchip[aria-pressed="true"] .lb{font-weight:var(--w-sel)}
.fchip[aria-pressed="true"]::after{content:"";position:absolute;bottom:4px;inset-inline:12px;height:var(--marker-h);background:var(--marker)}
.fchip .cnt{color:var(--tertiary);font-size:12px;font-weight:500}
.fchip .pres{width:5px;height:5px;border-radius:50%;background:var(--primary)}
.feed{list-style:none;padding:4px 0 0}
.sec{color:var(--tertiary);padding:18px 24px 4px}
.row{position:relative;display:grid;grid-template-columns:28px 1fr;column-gap:12px;padding:10px 20px 10px 20px}
.row .go{position:absolute;inset:0;border-radius:0;z-index:0}
.row > :not(.gl):not(.go){grid-column:2}
.row .gl{position:relative;grid-row:1 / span 3;color:var(--secondary);width:28px;height:28px;display:grid;place-items:center;margin-top:1px;pointer-events:none;z-index:1}
.row .gl .amark{top:1px;inset-inline-end:0}
.row .ln1{display:flex;gap:8px;align-items:baseline;color:var(--secondary);pointer-events:none;z-index:1;min-width:0}
.row .ln1 .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ln1 .tm{color:var(--tertiary);flex:none}
.row .ln1 .st{color:var(--tertiary);flex:none}
.row .say{color:var(--primary);pointer-events:none;z-index:1;text-wrap:pretty}
.row[data-att="opened"] .say{color:var(--secondary)}
.row[data-stale="1"] .say{color:var(--tertiary)}
.row .sec2{color:var(--tertiary);pointer-events:none;z-index:1}
.row .act{position:relative;z-index:2;justify-self:start;min-height:44px;margin:-6px -10px -10px;padding:0 10px;border-radius:12px;color:var(--primary)}
.row .act .lb{font-size:14px;line-height:1.6429;font-weight:var(--w-rest)}
.row .explain{grid-column:2;color:var(--secondary);margin-top:6px;z-index:2}
.row .explain .act{margin-top:0}

/* --------------------------------------------------------------------------------------- SETTINGS */
.set h2{color:var(--secondary);padding:22px 24px 6px}
.set .note{color:var(--tertiary);padding:4px 24px 0;max-width:380px}
.set .note.pro-opt{color:var(--secondary);padding-top:8px}
.srow{position:relative;display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:8px 20px 8px 24px;color:var(--primary);text-align:start}
#phone[dir="rtl"] .srow{padding:8px 24px 8px 20px}
.srow .lb{flex:1;min-width:0}
.srow .val{color:var(--secondary);flex:none}
.srow .chev{color:var(--tertiary);flex:none;line-height:0}
.srow.stmt{cursor:default;color:var(--secondary)}
.sw{flex:none;position:relative;width:40px;height:24px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--tertiary)}
.sw::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:16px;height:16px;border-radius:50%;background:var(--tertiary)}
[aria-checked="true"] > .sw{background:var(--primary);box-shadow:none}
[aria-checked="true"] > .sw::after{inset-inline-start:20px;background:var(--world)}
.seg{display:flex;gap:2px;padding:0 14px}
.seg button{position:relative;flex:1;min-height:44px;border-radius:12px;color:var(--rest);text-align:center}
.seg button .lb{font-size:15px;line-height:1.6667;font-weight:var(--w-rest)}
.seg button[aria-checked="true"]{color:var(--sel-ink)}
.seg button[aria-checked="true"] .lb{font-weight:var(--w-sel)}
.seg button[aria-checked="true"]::after{content:"";position:absolute;bottom:4px;inset-inline:28%;height:var(--marker-h);background:var(--marker)}
.optrow{display:flex;flex-wrap:wrap;gap:2px;padding:0 14px}
.optrow button{position:relative;min-height:44px;padding:0 10px;border-radius:12px;color:var(--rest)}
.optrow button .lb{font-size:15px;line-height:1.6667}
.osoff{margin:8px 20px 0;padding:14px 16px;border-radius:14px;background:var(--surface);color:var(--primary)}
.groups .srow{min-height:56px}
.groups .srow.here{font-weight:600}

/* ------------------------------------------------------- PERMISSION EDUCATION (PASSAGE) + the platform boundary */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40}
.sheet{position:absolute;inset-inline:0;bottom:0;z-index:41;background:var(--surface);border-start-start-radius:20px;border-start-end-radius:20px;padding:26px 24px calc(var(--home) + 14px);--ground:var(--surface)}
.sheet h2{color:var(--primary);outline:0;text-wrap:balance}
.sheet p{color:var(--secondary);margin-top:10px;text-wrap:pretty}
.sheet .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:18px;margin-inline-start:-10px}
.sheet .acts button{position:relative;min-height:44px;padding:0 10px;border-radius:12px}
.sheet .acts .pri{color:var(--primary)}.sheet .acts .sec{color:var(--rest)}
.sheet .opt{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;padding:6px 0;text-align:start;color:var(--primary);position:relative;border-radius:12px}
.sheet .opt .rad{flex:none;width:20px;height:20px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--tertiary)}
.sheet .opt[aria-checked="true"] .rad{box-shadow:inset 0 0 0 6px var(--primary)}
.sheet .opt .h{display:block;color:var(--tertiary);font-size:12px;line-height:1.6667}
.osbox{position:absolute;inset-inline:34px;top:34%;z-index:42;border:1.5px dashed var(--tertiary);border-radius:18px;padding:22px 20px;text-align:center;color:var(--secondary)}
.osbox .tag{display:block;font:600 10px/1.4 ui-monospace,Consolas,monospace;letter-spacing:.06em;color:var(--tertiary);margin-bottom:10px;direction:ltr}
.osbox .h{display:block;color:var(--primary);font-size:17px;line-height:1.6;font-weight:600}
.toastline{position:absolute;inset-inline:24px;bottom:calc(var(--home) + var(--rail) + var(--comp) + 12px);color:var(--secondary);z-index:9}

/* ------------------------------------------------------------------ PROOF HARNESS (not Product) */
body.live{display:flex;gap:36px;align-items:flex-start;padding:28px;min-height:100vh}
body.live #phone{flex-shrink:0;border-radius:44px;box-shadow:0 0 0 10px #050505,0 0 0 11px #2a2a2a}
.harness{width:440px;color:#cfcfcf;font:13px/1.55 system-ui,'Segoe UI',sans-serif}
.harness .flag{display:inline-block;font:700 11px/1 system-ui,'Segoe UI',sans-serif;letter-spacing:.06em;color:#101010;background:#e0b650;border-radius:4px;padding:5px 8px;margin-bottom:10px}
.harness h1{font-size:15px;margin:0 0 6px;color:#ececec}
.harness h2{font-size:12.5px;margin:16px 0 6px;color:#e2e2e2;font-weight:600}
.harness a,.harness button{display:inline-block;font:12px/1 system-ui,'Segoe UI',sans-serif;color:#dcdcdc;border:1px solid #444;border-radius:6px;padding:7px 9px;margin:0 4px 6px 0;background:#181818;text-decoration:none;cursor:pointer}
.harness a.on{border-color:#e0b650;color:#fff}
.harness pre{font:11px/1.5 ui-monospace,Consolas,monospace;color:#a8a8a8;white-space:pre-wrap;background:#121212;border:1px solid #2a2a2a;border-radius:6px;padding:8px;max-height:300px;overflow:auto}

<script>
// P3-A — the deterministic PRODUCT-BEHAVIOUR MODEL of the proof.
//
// This is not a runtime and not a state machine for production. It is the proof's single statement of what the frozen
// I-08N-01 contract and the Product Owner's accepted P3 direction (task §5–§15) require, written as pure functions over
// synthetic fixtures, so the prototype, the boards and the checks all read ONE answer and none of them can drift.
//
// Frozen authority it encodes (never redefines): I-08N-01 D06 (Quiet Hours + its two exceptions), D07/D08 (ceiling, not
// quota; one global budget + category sub-budgets), D09 (coalescing never across Worlds / authorities), D10 (classes),
// D12 (surfaces), D14–D17 (disclosure levels, default matrix, ceiling), D26 (Introductions need entered capability),
// D31/D40/D47 (seen ≠ resolved), D34 (per-World mute), D35 (Proactive off ≠ understanding off), D36 (critical ≠ OS
// bypass), D38/D39 (tap revalidates; no guessed destination), D50 (OS permission is a hard Push boundary), D51
// (foreground suppression), D59 (no delivery past semantic expiry); G3 §D (Matching never interrupts an active Live
// Call), the P3-A refinement §8 (ordinary attention waits during a call; only critical security and a requested
// exact-time reminder may show a call-safe strip), and the final micro-refinement §5–§7 (no ordinary attention is ever
// presented transiently inside the Analysis; it is re-evaluated when the user leaves, and at most one strip follows).
//
// Product Owner numbers it encodes (task §13–§14, "v1 safety ceilings — ceilings, never quotas"): ordinary Push
// 4 / rolling 24 h and 12 / rolling 7 d; Proactive QANDEEL 1 / 24 h and 3 / 7 d; same proactive thread ≥ 48 h after no
// engagement; a third same-subject interruption needs new meaningful context; Public Discovery 1 / 7 d, opt-in; Quiet
// Hours 23:00 → 08:00 device-local, ON by default.
//
// Everything else here is PROOF INTERPRETATION and is marked so where it is decided (search "PROOF INTERPRETATION").

const MIN = 1, HOUR = 60, DAY = 24 * 60;
/** Minutes since the fixture epoch (day 1, 00:00 device-local). `at(1,'09:30')`. */
const at = (day, hhmm) => { const [h, m] = hhmm.split(':').map(Number); return (day - 1) * DAY + h * HOUR + m; };
const clock = (t) => { const m = ((t % DAY) + DAY) % DAY; return `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; };
const dayOf = (t) => Math.floor(t / DAY) + 1;

// ------------------------------------------------------------------------------------------------ categories
/** The five semantic categories (I-08N-01 D08, D28, D30, D33). Activity keeps each item's category; never a World. */
const CATEGORIES = ['qandeel', 'shared', 'public', 'intro', 'system'];
/** Speaker identity (D18): only QANDEEL-initiated communication speaks as QANDEEL; everything else is Product voice. */
const SPEAKER = { qandeel: 'QANDEEL_VOICE', shared: 'PRODUCT_VOICE', public: 'PRODUCT_VOICE', intro: 'PRODUCT_VOICE', system: 'PRODUCT_VOICE' };

/** Disclosure levels (D14). Ordered. The user-facing words live in content.mjs; the codes are never shown. */
const LEVELS = ['L0', 'L1', 'L2', 'L3'];
const lvl = (l) => LEVELS.indexOf(l);
const minLevel = (a, b) => (lvl(a) <= lvl(b) ? a : b);

/** D15 — the default disclosure matrix, verbatim. The key is the disclosure SUBJECT (a category, or a named case). */
const DISCLOSURE_DEFAULTS = Object.freeze({
  qandeel: 'L1',      // Personal / Proactive QANDEEL
  shared: 'L2',       // Shared Worlds
  public: 'L2',       // Public interactions
  discovery: 'L1',    // Public discovery
  intro: 'L0',        // Introductions — and "must not even reveal that the event relates to Introductions"
  reminder: 'L2',     // user-requested reminders
  system: 'L2',       // System / account — minimum needed
  security: 'L2',     // Critical security — L2 even when Critical
});
/** Which disclosure subject an event belongs to. */
const subjectOf = (e) => (e.kind === 'reminder' ? 'reminder' : e.kind === 'discovery' ? 'discovery' : e.kind === 'security' ? 'security' : e.category);

/** The Product Owner's v1 hard safety ceilings (task §14). Ceilings, never quotas: nothing reads them to CREATE a send. */
const CEILINGS = Object.freeze({
  ordinary: { per24h: 4, per7d: 12 },
  proactive: { per24h: 1, per7d: 3, sameThreadHours: 48, thirdNeedsNewContext: true },
  discovery: { per7d: 1, optIn: true },
});
const QUIET_DEFAULT = Object.freeze({ on: true, from: '23:00', to: '08:00' });
const SNOOZE_OPTIONS = ['1h', '8h', '24h', 'custom'];
const PROACTIVE_OPTIONS = ['allow', 'reduce', 'off'];

/** A new user's settings (task §12–§13; D15 defaults as the lock-screen ceilings; Public Discovery opt-in = off). */
function defaultSettings() {
  return {
    os: 'not-requested',                 // 'not-requested' | 'granted' | 'denied' — the platform owns this
    proactive: 'allow',
    shared: { on: true, muted: [] },     // per-World mute list (D34)
    public: { interactions: true, discovery: false },
    intro: { entered: false, on: true }, // controls exist only after the capability is legitimately entered (D26)
    system: { other: true },             // critical security/account is not an in-app switch (D36)
    quiet: { ...QUIET_DEFAULT },
    snoozeUntil: null,
    lock: { ...DISCLOSURE_DEFAULTS },    // the user's ceiling per subject (D16/D17); starts at the D15 defaults
  };
}

// --------------------------------------------------------------------------------------------- quiet hours
const hm = (s) => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
/** Is device-local minute `t` inside Quiet Hours? The window may cross midnight (23:00 → 08:00). */
function inQuiet(t, quiet) {
  if (!quiet || !quiet.on) return false;
  const m = ((t % DAY) + DAY) % DAY, a = hm(quiet.from), b = hm(quiet.to);
  return a <= b ? m >= a && m < b : m >= a || m < b;
}
/** The next minute at which Quiet Hours end, from `t` (for deferral). */
function quietEnd(t, quiet) {
  const b = hm(quiet.to), m = ((t % DAY) + DAY) % DAY, base = t - m;
  return m < b ? base + b : base + DAY + b;
}
/** The two exceptions D06 / D37 name — and nothing else. */
const isQuietException = (e) => e.kind === 'reminder' || (e.kind === 'security' && e.critical === true);
/**
 * The ONLY two things that may be presented during an active Live Call (P3-A refinement §8), as a small non-blocking
 * call-safe strip: a genuinely critical security / account event, and an exact-time reminder the user explicitly asked
 * for (kind 'reminder' is, by the fixture contract, a user-requested exact-time reminder). Everything else waits.
 */
const isCallSafe = (e) => (e.kind === 'security' && e.critical === true) || (e.kind === 'reminder' && e.requested === true);

// ----------------------------------------------------------------------------------------------- budgets
/** Is this event competing in the ORDINARY interrupting budget? The two exceptions sit outside it (D08). */
const isOrdinary = (e) => !isQuietException(e);
const within = (hist, t, span, pred) => hist.filter((h) => h.at > t - span && h.at <= t && pred(h)).length;

/**
 * Proactive-thread rule (task §14 P3-O; I-08N D05 / D57): after a proactive Push on a thread with NO engagement,
 * the same thread may not re-interrupt before 48 h; a THIRD interruption on the same subject requires new meaningful
 * context (and the Gate re-run, which the fixture states as `gate`).
 */
function proactiveThreadVerdict(e, hist) {
  const prior = hist.filter((h) => h.kind === 'proactive' && h.thread === e.thread).sort((a, b) => a.at - b.at);
  if (!prior.length) return { ok: true };
  const last = prior[prior.length - 1];
  if (!last.engaged && e.at - last.at < CEILINGS.proactive.sameThreadHours * HOUR) return { ok: false, reason: 'same-thread-48h' };
  if (prior.length >= 2 && !e.newContext) return { ok: false, reason: 'third-needs-new-context' };
  return { ok: true };
}

/** Budget verdict for a Push candidate at time e.at against the Push history (only pushes are recorded). */
function budgetVerdict(e, hist) {
  if (!isOrdinary(e)) return { ok: true, outside: true };
  const ord = (h) => isOrdinary(h);
  if (within(hist, e.at, DAY, ord) >= CEILINGS.ordinary.per24h) return { ok: false, reason: 'ordinary-24h' };
  if (within(hist, e.at, 7 * DAY, ord) >= CEILINGS.ordinary.per7d) return { ok: false, reason: 'ordinary-7d' };
  if (e.kind === 'proactive') {
    const pro = (h) => h.kind === 'proactive';
    if (within(hist, e.at, DAY, pro) >= CEILINGS.proactive.per24h) return { ok: false, reason: 'proactive-24h' };
    if (within(hist, e.at, 7 * DAY, pro) >= CEILINGS.proactive.per7d) return { ok: false, reason: 'proactive-7d' };
    const th = proactiveThreadVerdict(e, hist);
    if (!th.ok) return th;
  }
  if (e.kind === 'discovery' && within(hist, e.at, 7 * DAY, (h) => h.kind === 'discovery') >= CEILINGS.discovery.per7d) return { ok: false, reason: 'discovery-7d' };
  return { ok: true };
}

// ------------------------------------------------------------------------------------------- the decision
/**
 * Where does one candidate go right now? Returns { surface, level, reasons[], mark }.
 *   surface ∈ 'push' | 'strip' | 'call-strip' | 'in-place' | 'activity' | 'next-conversation' | 'deferred' | 'suppressed' | 'stale'
 *   ('call-strip' = the small, non-blocking call-safe strip; only isCallSafe() events, only during an active Live Call)
 * `ctx` = { settings, hist (earlier pushes), app: 'foreground' | 'background', here: contextId | null, liveCall: bool,
 *          view: 'analysis' | 'conversation' | 'shared' | … (proof context: the Product view in front of the user) }.
 * Every non-suppressed outcome also leaves (or keeps) a truthful Activity item; `mark` says whether it is
 * attention-worthy (the Attention Mark), which is ATTENTION STATE, never event state (D31, D44).
 */
function decide(e, ctx) {
  const s = ctx.settings, R = [];
  const out = (surface, extra = {}) => ({ surface, level: extra.level ?? null, reasons: R, mark: extra.mark ?? (surface !== 'suppressed' && surface !== 'stale' && e.cls <= 3), activity: surface !== 'suppressed' });
  // 1. authority and semantic time (D38, D39, D59): a target that is gone, or a window that has closed, is not delivered.
  if (e.expiresAt != null && ctx.now >= e.expiresAt) { R.push('semantic-expiry'); return out('stale', { mark: false }); }
  if (e.targetGone) { R.push('stale-target'); return out('stale', { mark: false }); }
  // 2. eligibility per category (D26, D03/D25, D34, D35)
  if (e.category === 'intro' && !s.intro.entered) { R.push('intro-not-entered'); return out('suppressed'); }
  if (e.kind === 'discovery' && !s.public.discovery) { R.push('discovery-not-opted-in'); return out('suppressed'); }
  const muted = (e.category === 'shared' && (!s.shared.on || s.shared.muted.includes(e.context))) ||
    (e.category === 'public' && e.kind !== 'discovery' && !s.public.interactions) ||
    (e.category === 'intro' && !s.intro.on) || (e.category === 'system' && e.kind !== 'security' && !s.system.other);
  if (muted) { R.push('muted-context'); return out('activity', { mark: false }); }

  // "Reduce" (Product Owner meaning, refinement §7): Reduce TIGHTENS the Proactive Gate's interruption decision — it
  // keeps interruption for the highest-value or strongest-timing reasons. It is not a class rule: a Class 2 candidate
  // may still wait and a Class 3 Meaningful candidate may still interrupt. The proof does not score anything; the fixture
  // states, as an explicit boolean, the already-run Gate's finding (`reduceEligible`: strong enough to interrupt under
  // Reduce). No weight, score, threshold or schema is implied. Every later rule (Class 4, Quiet Hours, ceilings,
  // disclosure, authority) still applies on top.
  if (e.kind === 'proactive' && s.proactive === 'reduce' && e.reduceEligible !== true) { R.push('proactive-reduced'); return out('next-conversation', { mark: false }); }
  // 3. ambient events never interrupt (D10 Class 4, D25): Activity only, no mark pressure.
  if (e.cls >= 4 && e.kind !== 'discovery') { R.push('ambient'); return out('activity', { mark: false }); }
  // 3b. an active Live Call (G3 §D; refinement §8) — on either surface, foreground or background: ordinary Shared /
  // Public / Introductions / Proactive attention is deferred and re-evaluated after the call. Only the two call-safe
  // cases may be presented now — in the foreground as the small call-safe strip; in the background by the normal path.
  if (ctx.liveCall && !isCallSafe(e)) { R.push('live-call-deferred'); return out('deferred', { mark: true }); }

    // 4a. the Analysis (final micro-refinement §5–§6): the Analysis is not an attention surface. While the user is inside
    // it, ordinary attention is NEVER presented transiently — call or no call. It is deferred: it stays truthfully in
    // Activity (with the mark where it is attention-worthy) and is re-evaluated when the user leaves (reevaluatePending).
    // The only thing ever laid over the Analysis is the call-safe strip above, during an active Live Call. There is no
    // other exception: critical security outside a call waits here too (no frozen rule names another surface).
    // `ctx.view` is PROOF CONTEXT (where the user is looking), not a production schema.
    if (ctx.view === 'analysis') { R.push('analysis-deferred'); return out('deferred'); }
    if (ctx.here && ctx.here === e.context) { R.push('same-context'); return out('in-place', { mark: false }); }
    if (e.kind === 'discovery') { R.push('discovery-no-strip'); return out('activity', { mark: false }); }

  if (s.os !== 'granted') { R.push('os-permission-' + s.os); return out('activity'); }
  if (!isQuietException(e)) {
    if (s.snoozeUntil != null && ctx.now < s.snoozeUntil) { R.push('snoozed'); return out('deferred'); }
    if (inQuiet(ctx.now, s.quiet)) { R.push('quiet-hours'); return out('deferred'); }
  }

  const b = budgetVerdict({ ...e, at: ctx.now }, ctx.hist);
  // a refused Proactive candidate waits for the next conversation (D12 surface); a refused Discovery is the first
  // candidate for suppression (D25); anything else stays a truthful Activity item.
  if (!b.ok) { R.push('ceiling:' + b.reason); return out(e.kind === 'proactive' ? 'next-conversation' : e.kind === 'discovery' ? 'suppressed' : 'activity', { mark: e.kind === 'proactive' || e.kind === 'discovery' ? false : undefined }); }

  // `safeMax` is EVENT-specific (what this one event's bounded safe projection can truthfully carry); no category —
  // Introductions included — has a permanent cap of its own beyond its D15 default and the user's explicit ceiling.
  const subj = subjectOf(e);
  const level = minLevel(e.safeMax ?? 'L3', s.lock[subj] ?? DISCLOSURE_DEFAULTS[subj]);
  R.push('push'); return out('push', { level });
}

// ---------------------------------------------------------------------------------- disclosure projection
/**
 * The bounded safe projection (I-08N §10): the renderer receives only what the level allows. `p` is the event's
 * projection source (content.mjs supplies the words per language). Returns { title, body } — the ONLY strings a
 * notification of that level may carry. No projection ever combines two contexts (it is built from ONE event).
 */
function project(e, level, words) {
  const w = words;
  if (level === 'L0') return { title: null, body: w.l0 };                                   // nothing about category or context
  if (level === 'L1') return { title: null, body: w.generic[subjectOf(e)] };               // category-generic
  if (level === 'L2') return { title: e.ctxName ?? w.ctxTitle[subjectOf(e)], body: e.bounded };   // context, not content
  return { title: e.ctxName ?? w.ctxTitle[subjectOf(e)], body: e.preview };                 // content preview (never default)
}

// ------------------------------------------------------------------------------------------- coalescing
/**
 * D09: same-context, same-kind, low-value repetition MAY be coalesced; different Worlds / authorities NEVER are. The key
 * therefore always contains the category AND the exact context; an item that is actionable or Class ≤ 2 stays alone.
 */
const coalesceKey = (e) => (e.cls <= 2 || e.actionable ? null : `${e.category}|${e.context}|${e.kind}`);

  const groups = new Map(), out = [];
  for (const e of items) {
    const k = coalesceKey(e);
    if (!k) { out.push({ ...e, members: [e.id] }); continue; }
    if (!groups.has(k)) { const g = { ...e, members: [e.id], count: 1 }; groups.set(k, g); out.push(g); }
    else { const g = groups.get(k); g.members.push(e.id); g.count++; g.at = Math.max(g.at, e.at); }
  }

}
/** A coalesced group is valid only if every member shares category and context (the check the planted defect breaks). */
const coalescedValid = (g, byId) => g.members.every((id) => byId[id].category === g.category && byId[id].context === g.context);

// ------------------------------------------------------------------------------ Quiet Hours end: no dump
/**
 * Task §13 P3-M: at the end of Quiet Hours every pending candidate is RE-EVALUATED as if it were new — nothing is
 * released merely because it waited. PROOF INTERPRETATION of "no dump": the boundary itself is not a reason to
 * interrupt, so a waiting candidate earns a Push at 08:00 only if its value is still TIMELY now (Class ≤ 2 now, or a
 * Proactive candidate whose Gate says "useful now" at 08:00); every other one lands in Activity (coalesced where D09
 * allows), goes stale, or is suppressed. The ordinary ceilings still apply on top.
 */
function reevaluateAtQuietEnd(pending, ctx) {
  const t = ctx.now, hist = [...ctx.hist], results = [];
  const order = [...pending].sort((a, b) => (a.clsAtEnd ?? a.cls) - (b.clsAtEnd ?? b.cls) || a.at - b.at);
  for (const e0 of order) {
    const e = { ...e0, cls: e0.clsAtEnd ?? e0.cls };
    let r = decide(e, { ...ctx, hist, now: t });
    if (r.surface === 'push' && !(e.cls <= 2 || (e.kind === 'proactive' && e.usefulAtEnd))) {
      r = { ...r, surface: 'activity', reasons: [...r.reasons.filter((x) => x !== 'push'), 'not-timely-at-quiet-end'] };
    }
    if (r.surface === 'push') hist.push({ at: t, kind: e.kind, category: e.category, thread: e.thread, critical: !!e.critical, engaged: false, id: e.id });
    results.push({ id: e.id, ...r });
  }
  const acts = coalesce(pending.filter((e) => results.find((r) => r.id === e.id).surface === 'activity'));
  return { results, activityGroups: acts, pushes: results.filter((r) => r.surface === 'push').length };
}

// ------------------------------------------------------------- leaving a deferring state: re-evaluate, never replay
/**
 * Final micro-refinement §7 (and the same law after a Live Call, G3 §D): when a deferring condition ends — the user
 * leaves the Analysis, or the call ends — every waiting candidate is decided AGAIN against current truth, authority,
 * eligibility and context. Nothing is presented merely because it waited: a candidate that went stale, whose World was
 * muted meanwhile, or whose originating context the user is now in, gets that answer instead. AT MOST ONE strip: if
 * several are strip-eligible now, the one with the highest attention value is presented (lowest Interruption Class; on a
 * tie, the one that has waited longest — PROOF INTERPRETATION of "higher attention value", and the same order the first P3-A pass used after a call) and the others stay in Activity, marked.
 * A candidate that is still deferred now (e.g. the call continues) keeps waiting.
 * Returns { results: [{ id, surface, reasons, mark }], strip: id | null, pending: [id] }.
 */
function reevaluatePending(pending, ctx) {
  const results = pending.map((e) => ({ id: e.id, e, ...decide(e, ctx) }));
  const strips = results.filter((r) => r.surface === 'strip').sort((a, b) => a.e.cls - b.e.cls || (a.e.at ?? 0) - (b.e.at ?? 0));
  for (const r of strips.slice(1)) { r.surface = 'activity'; r.reasons = [...r.reasons, 'one-strip-at-a-time']; }
  return {
    results: results.map(({ e, ...r }) => r),
    strip: strips.length ? strips[0].id : null,
    pending: results.filter((r) => r.surface === 'deferred').map((r) => r.id),
  };
}

/** Run a whole candidate trace (time-ordered) through decide(), recording the pushes it makes. */
function runTrace(events, settings, { app = 'background', here = null, liveCall = false } = {}) {
  const hist = [], rows = [];
  for (const e of [...events].sort((a, b) => a.at - b.at)) {
    const r = decide(e, { settings, hist, app, here, liveCall, now: e.at });
    if (r.surface === 'push') hist.push({ at: e.at, kind: e.kind, category: e.category, thread: e.thread, critical: !!e.critical, engaged: !!e.engagedAfter, id: e.id });
    rows.push({ id: e.id, at: e.at, ...r,
      ord24: within(hist, e.at, DAY, isOrdinary), ord7: within(hist, e.at, 7 * DAY, isOrdinary),
      pro24: within(hist, e.at, DAY, (h) => h.kind === 'proactive'), pro7: within(hist, e.at, 7 * DAY, (h) => h.kind === 'proactive') });
  }

// ------------------------------------------------------------------------------------ attention indicators
/**
 * D44/D45/D48 + task §7: the GLOBAL indicator is PRESENCE, derived from eligible attention items — never a number and
 * never a sum. Inside Activity, a category indicator is a count only where the Product Owner allowed one: Shared (a
 * useful count), System (only genuinely actionable items). Public defaults to presence; Introductions is presence ONLY.
 */
function indicators(items) {
  const att = items.filter((i) => i.attention === 'unseen' || (i.actionable && !i.resolved));
  const cat = (c) => att.filter((i) => i.category === c);
  return {
    global: { present: att.length > 0 },                              // no count field exists, by construction
    shared: { present: cat('shared').length > 0, count: cat('shared').length || null },
    public: { present: cat('public').length > 0 },
    intro: { present: cat('intro').length > 0 },
    system: { present: cat('system').length > 0, count: cat('system').filter((i) => i.actionable && !i.resolved).length || null },
    qandeel: { present: cat('qandeel').length > 0 },

}

/** Seen / opened are attention states (D31, D40, D47). They never touch the source event's truth. */
function markSeen(item) { return { ...item, attention: item.attention === 'unseen' ? 'seen' : item.attention }; }

 *  (the call-safe strip is a separate surface: see isCallSafe), never while the user is inside the Analysis. */
const stripEligible = (e, ctx) => decide(e, { ...ctx, app: 'foreground' }).surface === 'strip';

  function render() {

  // ------------------------------------------------------------------------------------------------ input
  function onClick(e) {
    const b = e.target.closest('button'); if (!b || !document.getElementById('phone').contains(b)) return;
    if (b.id === 'act-entry') return go('activity');
    if (b.id === 'door') return go('analysis');
    if (b.matches('[data-back]')) return back();
    if (b.dataset.to) return go(b.dataset.to);
    if (b.closest('.strip')) {
      if (b.classList.contains('x')) return dismissStrip();
      const ev = S.strip.ev; return dismissStrip(() => enter({ ...ev, id: S.feed.find((i) => i.id.startsWith(ev.id))?.id || ev.id }));
    }
    if (b.dataset.go) { const it = S.feed.find((i) => i.id === b.dataset.go); return enter(it); }
    if (b.dataset.openctx) return go('shared', b.dataset.openctx);
    if (b.dataset.act) { const it = S.feed.find((i) => i.id === b.dataset.act); Object.assign(it, M.markOpened(it)); return go('settings', 'account'); }
    if (b.dataset.filter) { S.filter = b.dataset.filter; S.keepScroll = true; render(); return; }
    if (b.dataset.pro) { S.settings.proactive = b.dataset.pro; S.keepScroll = true; render(); if (b.dataset.pro === 'allow') eduFor('proactive-allow'); return; }
    if (b.dataset.sw) { const k = b.dataset.sw, s = S.settings; ({ shared: () => s.shared.on = !s.shared.on, pinter: () => s.public.interactions = !s.public.interactions, pdisc: () => s.public.discovery = !s.public.discovery, intro: () => s.intro.on = !s.intro.on, sysother: () => s.system.other = !s.system.other, quiet: () => s.quiet.on = !s.quiet.on })[k](); S.keepScroll = true; render(); return; }
    if (b.dataset.world) { const w = b.dataset.world, m = S.settings.shared.muted; S.settings.shared.muted = m.includes(w) ? m.filter((x) => x !== w) : [...m, w]; S.keepScroll = true; render(); return; }
    if (b.dataset.lock) { S.sheet = { kind: 'lock', subject: b.dataset.lock }; S.keepScroll = true; render(); return; }
    if (b.dataset.level) { S.settings.lock[S.sheet.subject] = b.dataset.level; S.sheet = null; S.keepScroll = true; render(); return; }
    if (b.dataset.device) { S.osbox = true; S.keepScroll = true; render(); return; }

      'shared-strip-qandeel': () => { S.place = 'shared'; S.here = 'w-summer'; render(); arrive({ ...FX.EV.proactive }); },
      'conv-strip-system': () => { render(); arrive({ ...FX.EV.security, actionable: true }); },
      'shared-inplace': () => { S.place = 'shared'; S.here = 'w-summer'; render(); arrive({ ...FX.EV.sharedReply }); },
      'conv-call': () => { S.call = true; S.feed.forEach((i) => { i.attention = 'seen'; i.actionable = false; }); render(); if (Q.get('arrive') !== '0') { arrive({ ...FX.EV.sharedReply }); arrive({ ...FX.EV.introProposal }); } },
      shared: () => { S.settings.os = 'not-requested'; S.place = 'shared'; S.here = 'w-summer'; render(); },   // first entry: permission not yet asked
      activity: () => { S.place = 'activity'; render(); scheduleSeen(); },
      'activity-stale': () => { S.place = 'activity'; S.staleOpen = 'F9'; render(); const r = document.querySelector('.row[data-id="F9"]'); const b = document.querySelector('.page .body'); if (r && b) b.scrollTop = r.offsetTop - 120; },
      'settings-root': () => { S.place = 'settings'; render(); },

      edu: () => { S.settings.os = 'not-requested'; S.place = 'shared'; S.here = 'w-summer'; render(); eduFor('shared-first-entry'); },
      'edu-boundary': () => { S.settings.os = 'not-requested'; S.place = 'shared'; S.here = 'w-summer'; S.osbox = true; render(); },
      'edu-notnow': () => { S.settings.os = 'not-requested'; S.place = 'shared'; S.here = 'w-summer'; S.eduDeclined = true; S.notNow = true; render(); },
      // ---- refinement §8: an active Live Call on the Conversation surface (G1.2: opening «المحادثة» does not end it)
      'conv-call-security': () => { callBase(); render(); arrive({ ...FX.EV.security }); },
      'conv-call-reminder': () => { callBase(); render(); arrive({ ...FX.EV.reminder }); },
      // ---- the Analysis (G3's own page in a frame; refinement §4.2 and §8)
      analysis: () => { S.place = 'analysis'; g32Frame(); render(); },
      'analysis-call': () => { callBase(); S.place = 'analysis'; g32Frame(); render(); },
    };
    // arrivals that need G3's measured chrome run once the frame is ready
    const later = {
      'analysis-call': () => { if (Q.get('arrive') !== '0') { arrive({ ...FX.EV.sharedReply }); arrive({ ...FX.EV.introProposal }); arrive({ ...FX.EV.proactive }); } },
      'analysis-call-security': () => arrive({ ...FX.EV.security }),
      'analysis-call-reminder': () => arrive({ ...FX.EV.reminder }),
      // final micro-refinement §5–§7: ordinary attention while the user is inside the Analysis (no call) — deferred, no
      // strip, no announcement; `analysis-exit` then leaves by «المحادثة» and the model re-evaluates (at most one strip).
      // ?arrive=reply keeps only the Shared reply; ?mute=<World> mutes that World before the user leaves.
      'analysis-deferred': () => analysisArrivals(),
      'analysis-exit': () => { analysisArrivals(); if (Q.get('mute')) S.settings.shared.muted.push(Q.get('mute')); back(); },
    };
    const analysisArrivals = () => { const ks = Q.get('arrive') === 'reply' ? ['sharedReply'] : ['sharedReply', 'publicReply', 'introProposal', 'proactive']; for (const k of ks) arrive({ ...FX.EV[k] }); };
    setup['analysis-call-security'] = setup['analysis-call-reminder'] = () => { callBase(); S.place = 'analysis'; g32Frame(); render(); };
    setup['analysis-deferred'] = setup['analysis-exit'] = () => { callBase(); S.call = false; S.place = 'analysis'; g32Frame(); render(); };
    (setup[st] || setup.conv)();
    if (P.defect === 'firstlaunch' && st === 'conv') { S.settings.os = 'not-requested'; S.sheet = { kind: 'edu', trigger: 'launch' }; render(); }
    if (P.defect === 'samectx' && st === 'shared-inplace') { S.inplace = null; showStrip({ ...FX.EV.sharedReply }, true); }
    if (Q.get('press') === 'entry') document.getElementById('act-entry')?.classList.add('down');
    if (P.capture) tick(1000); // settle entrances; the strip's hold (6 s) is still running
    Promise.all([document.fonts.ready, S.place === 'analysis' ? g32Ready : null]).then(() => {
