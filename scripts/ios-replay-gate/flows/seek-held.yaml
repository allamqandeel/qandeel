# S8B-07 CP2-A.1 iOS Replay gate, C-SEEK-HELD, in ONE flow: Play; once the text moment 5 is read, Pause; once held, a
# step BACK on the timeline at P1; once it landed, a step FORWARD at P2; until it landed. Still held: the runner judges
# the places, that they stay, and Play from the last.
appId: com.qandeel.mobile
---
- tapOn:
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
    id: "qandeel-replay-play"
- extendedWaitUntil:
    visible:
      id: "irg-readout"
      text: "ord=5 .*play=1 .*"
    timeout: 30000
- tapOn:
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
    id: "qandeel-replay-play"
- extendedWaitUntil:
    visible:
      id: "irg-readout"
      text: ".*play=0 .*"
    timeout: 5000
- tapOn:
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
    point: "${P1}"
- extendedWaitUntil:
    visible:
      id: "irg-readout"
      text: ".*lands=[0-9.]+ .*"
    timeout: 8000
- tapOn:
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 500
    point: "${P2}"
- extendedWaitUntil:
    visible:
      id: "irg-readout"
      text: ".*lands=[0-9.x]+,[0-9.]+ .*"
    timeout: 8000
