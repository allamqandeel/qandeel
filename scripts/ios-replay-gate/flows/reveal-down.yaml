# S8B-07 CP2-A.1 iOS Replay gate: bring the element whose id is ID on screen by scrolling DOWN if it is not visible yet,
# then one tap on it (no retry). A small screen does not show the whole conversation at once. (Maestro takes no variable
# in `direction:`: one flow per direction.)
appId: com.qandeel.mobile
---
- scrollUntilVisible:
    element:
      id: "${ID}"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 100
    centerElement: false
- tapOn:
    retryTapIfNoChange: false
    waitToSettleTimeoutMs: 1500
    id: "${ID}"
